name: Supabase Keep-Alive

on:
  schedule:
    - cron: '*/5 * * * *'   # каждые 5 минут
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase Auth (будит GoTrue)
        run: |
          curl -s -o /dev/null -w "Auth: HTTP %{http_code} in %{time_total}s\n" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            "https://wgewycchecbsulyvqfzj.supabase.co/auth/v1/settings"

      - name: Ping Supabase REST (будит Postgres)
        run: |
          curl -s -o /dev/null -w "REST: HTTP %{http_code} in %{time_total}s\n" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" \
            "https://wgewycchecbsulyvqfzj.supabase.co/rest/v1/"
