<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="manifest" href="./manifest.json">
    <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
    <link rel="icon" type="image/png" sizes="192x192" href="android-chrome-192x192.png">
    <meta name="theme-color" content="#7c3aed">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Smart Social">
    <title>Поиск | Smart Social</title>
    
    <script src="config.js"></script>
    <script src="i18n.js"></script>
    <script src="angel-widget.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <style>
        :root {
            --bg-primary: linear-gradient(135deg, #f5f0ff 0%, #e9d9ff 100%);
            --bg-secondary: #ffffff;
            --text-primary: #1e1e2f;
            --text-secondary: #6b6b80;
            --accent: #7c3aed;
            --border: #e9d9ff;
            --shadow: rgba(124, 58, 237, 0.1);
        }
        [data-theme="dark"] {
            --bg-primary: linear-gradient(135deg, #1a0b2e 0%, #2d1b4e 100%);
            --bg-secondary: #2a1a3e;
            --text-primary: #f5f0ff;
            --text-secondary: #c4b5fd;
            --accent: #a78bfa;
            --border: #4c1d95;
            --shadow: rgba(167, 139, 250, 0.2);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; transition: all 0.3s ease; }
        body { font-family: system-ui, sans-serif; background: var(--bg-primary); min-height: 100vh; color: var(--text-primary); padding-bottom: 80px; }

        header { background: var(--bg-secondary); padding: 12px 20px; border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 100; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 2px 10px var(--shadow); }
        .logo { font-weight: 700; font-size: 20px; color: var(--accent); cursor: pointer; }
        .controls { display: flex; gap: 10px; align-items: center; }
        select { padding: 6px; border-radius: 8px; border: 1px solid var(--border); background: var(--bg-secondary); color: var(--text-primary); }
        .btn-sm { background: transparent; border: 1px solid var(--border); color: var(--text-secondary); padding: 6px 12px; border-radius: 16px; cursor: pointer; font-size: 13px; text-decoration: none; display: inline-block; }
        .btn-sm:hover { background: var(--border); color: var(--text-primary); }
        .profile-btn { width: 36px; height: 36px; border-radius: 50%; border: 2px solid var(--accent); background: var(--border); cursor: pointer; overflow: hidden; padding: 0; display: flex; align-items: center; justify-content: center; font-size: 18px; }
        .profile-btn img { width: 100%; height: 100%; object-fit: cover; }

        .nav-item { position: relative; display: inline-flex; align-items: center; }
        .badge { background: #ef4444; color: white; font-size: 10px; padding: 2px 6px; border-radius: 10px; margin-left: 4px; font-weight: bold; display: none; }
        .badge.show { display: inline-block; }
        .burger-btn { display: none; background: none; border: none; font-size: 28px; cursor: pointer; color: var(--text-primary); padding: 8px 12px; min-width: 44px; min-height: 44px; }

        @media (max-width: 900px) {
            .burger-btn { display: block; }
            .controls { display: none; position: absolute; top: 100%; left: 0; right: 0; background: var(--bg-secondary); flex-direction: column; padding: 15px; border-bottom: 1px solid var(--border); box-shadow: 0 4px 12px var(--shadow); z-index: 101; max-height: 80vh; overflow-y: auto; }
            .controls.active { display: flex; }
            .controls a, .controls button, .controls select, .controls .nav-item { width: 100%; margin: 5px 0; text-align: center; justify-content: center; }
        }

        .container { max-width: 600px; width: 100%; margin: 20px auto; padding: 0 16px; }
        .search-box { background: var(--bg-secondary); padding: 20px; border-radius: 16px; border: 1px solid var(--border); box-shadow: 0 4px 12px var(--shadow); margin-bottom: 24px; }
        .search-input { width: 100%; padding: 14px; border: 1px solid var(--border); border-radius: 12px; background: var(--bg-primary); color: var(--text-primary); font-size: 16px; outline: none; }
        .search-input:focus { border-color: var(--accent); }

        .results-header { font-size: 16px; font-weight: 600; margin-bottom: 12px; color: var(--accent); }
        .user-list { display: flex; flex-direction: column; gap: 12px; }
        .user-card { background: var(--bg-secondary); border: 1px solid var(--border); border-radius: 16px; padding: 14px; display: flex; align-items: center; gap: 14px; box-shadow: 0 2px 8px var(--shadow); cursor: pointer; }
        .user-card:hover { transform: translateY(-2px); border-color: var(--accent); }
        .user-avatar { width: 50px; height: 50px; border-radius: 50%; background: var(--border); display: flex; align-items: center; justify-content: center; font-size: 24px; overflow: hidden; flex-shrink: 0; }
        .user-avatar img { width: 100%; height: 100%; object-fit: cover; }
        .user-info { flex: 1; min-width: 0; }
        .user-name { font-weight: 600; font-size: 16px; margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .user-bio { font-size: 13px; color: var(--text-secondary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .empty-state { text-align: center; padding: 30px 20px; color: var(--text-secondary); font-size: 14px; background: var(--bg-secondary); border-radius: 16px; border: 1px dashed var(--border); }

        .theme-toggle { position: fixed; bottom: 20px; left: 20px; width: 48px; height: 48px; border-radius: 50%; background: var(--bg-secondary); border: 1px solid var(--border); display: flex; align-items: center; justify-content: center; cursor: pointer; box-shadow: 0 4px 12px var(--shadow); font-size: 20px; z-index: 1000; }
    </style>
</head>
<body>
    <header>
        <div class="logo" onclick="location.href='feed.html'">Smart Social</div>
        <button class="burger-btn" id="burgerBtn">☰</button>
        <div class="controls" id="navControls">
            <select id="langSelect">
                <option value="ru">🇷🇺 RU</option><option value="uk">🇺🇦 UA</option>
                <option value="en">🇬🇧 EN</option><option value="es">🇪🇸 ES</option><option value="de">🇩🇪 DE</option>
            </select>
            <button class="profile-btn" onclick="location.href='profile.html'"><span id="headerAvatar"></span></button>
            <a href="feed.html" class="btn-sm" data-i18n="nav_feed">📰 Лента</a>
            <a href="search.html" class="btn-sm" data-i18n="nav_search">🔍 Поиск</a>
            <div class="nav-item">
                <a href="chat.html" class="btn-sm" data-i18n="nav_chat">💬 Чат</a>
                <span id="chatBadge" class="badge">0</span>
            </div>
            <a href="friends.html" class="btn-sm" data-i18n="nav_friends">👥 Друзья <span id="friendsBadge" class="badge">0</span></a>
            <a href="about.html" class="btn-sm" data-i18n="nav_about">ℹ️ О сайте</a>
            <div class="nav-item">
                <a href="guests.html" class="btn-sm" data-i18n="nav_guests">👀 Гости</a>
                <span id="guestBadge" class="badge">0</span>
            </div>
            <button class="btn-sm" id="logoutBtn" data-i18n="nav_logout">Выйти</button>
        </div>
    </header>

    <div class="container">
        <div class="search-box">
            <input type="text" id="searchInput" class="search-input" placeholder="Поиск по имени или статусу...">
        </div>

        <div class="results-header" id="resultsHeader" style="display: none;">Результаты поиска</div>
        <div class="user-list" id="searchResults">
            <div class="empty-state">Начни вводить имя, чтобы найти друзей 🔍</div>
        </div>
    </div>

    <button class="theme-toggle" id="themeToggle">🌙</button>

    <script>
        if (typeof SUPABASE_URL === 'undefined') { alert('Ошибка конфига'); window.location.href = 'index.html'; }
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        let currentUser = null;

        // === БУРГЕР-МЕНЮ ===
        const burgerBtn = document.getElementById('burgerBtn');
        const navControls = document.getElementById('navControls');
        if (burgerBtn && navControls) {
            burgerBtn.onclick = () => navControls.classList.toggle('active');
            navControls.querySelectorAll('a').forEach(link => link.onclick = () => navControls.classList.remove('active'));
        }

        // === СЧЕТЧИКИ (БЕЙДЖИ) ===
        async function updateBadges() {
            if (!currentUser) return;
            const { count: guestCount } = await supabaseClient.from('profile_visits').select('*', { count: 'exact', head: true }).eq('host_id', currentUser.id).eq('is_read', false);
            const gBadge = document.getElementById('guestBadge');
            if (gBadge) { gBadge.textContent = guestCount > 99 ? '99+' : guestCount; guestCount > 0 ? gBadge.classList.add('show') : gBadge.classList.remove('show'); }
            
            const { count: msgCount } = await supabaseClient.from('messages').select('*', { count: 'exact', head: true }).eq('receiver_id', currentUser.id).eq('is_read', false);
            const cBadge = document.getElementById('chatBadge');
            if (cBadge) { cBadge.textContent = msgCount > 99 ? '99+' : msgCount; msgCount > 0 ? cBadge.classList.add('show') : cBadge.classList.remove('show'); }
            
            const { count: friendReqCount } = await supabaseClient.from('friendships').select('*', { count: 'exact', head: true }).eq('addressee_id', currentUser.id).eq('status', 'pending');
            const fBadge = document.getElementById('friendsBadge');
            if (fBadge) { fBadge.textContent = friendReqCount > 99 ? '99+' : friendReqCount; friendReqCount > 0 ? fBadge.classList.add('show') : fBadge.classList.remove('show'); }
        }

        // === ТЕМА ===
        const themeToggle = document.getElementById('themeToggle');
        if (localStorage.getItem('theme') === 'dark') { document.documentElement.setAttribute('data-theme', 'dark'); themeToggle.textContent = '☀️'; }
        themeToggle.onclick = () => {
            const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
            document.documentElement.setAttribute('data-theme', isDark ? 'light' : 'dark');
            themeToggle.textContent = isDark ? '🌙' : '☀️';
            localStorage.setItem('theme', isDark ? 'light' : 'dark');
        };

        document.getElementById('logoutBtn').onclick = async () => { await supabaseClient.auth.signOut(); window.location.href = 'index.html'; };

        async function init() {
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (!session) return window.location.href = 'index.html';
            currentUser = session.user;
            
            // Загружаем аватар в шапку
            const { data: u } = await supabaseClient.from('users').select('avatar_url').eq('id', currentUser.id).single();
            if (u && u.avatar_url) document.getElementById('headerAvatar').innerHTML = `<img src="${u.avatar_url}">`;

            updateBadges();
        }

        // === ПОИСК ===
        const searchInput = document.getElementById('searchInput');
        const resultsList = document.getElementById('searchResults');
        const resultsHeader = document.getElementById('resultsHeader');
        let searchTimeout;

        searchInput.addEventListener('input', (e) => {
            clearTimeout(searchTimeout);
            const query = e.target.value.trim();
            
            if (query.length < 2) {
                resultsList.innerHTML = '<div class="empty-state">Начни вводить имя, чтобы найти друзей 🔍</div>';
                resultsHeader.style.display = 'none';
                return;
            }

            searchTimeout = setTimeout(() => performSearch(query), 300);
        });

        async function performSearch(query) {
            resultsList.innerHTML = '<div class="empty-state">Поиск...</div>';
            resultsHeader.style.display = 'block';

            try {
                const { data: users, error } = await supabaseClient
                    .from('users')
                    .select('id, username, bio, avatar_url')
                    .ilike('username', `%${query}%`)
                    .neq('id', currentUser.id) // Исключаем себя из поиска
                    .limit(20);

                if (error) throw error;

                if (!users || users.length === 0) {
                    resultsList.innerHTML = '<div class="empty-state">Никого не найдено. Попробуй другой запрос 🌙</div>';
                    return;
                }

                resultsHeader.textContent = `Найдено: ${users.length}`;
                resultsList.innerHTML = users.map(u => `
                    <div class="user-card" onclick="location.href='profile.html?user_id=${u.id}'">
                        <div class="user-avatar">
                            ${u.avatar_url ? `<img src="${u.avatar_url}">` : '👤'}
                        </div>
                        <div class="user-info">
                            <div class="user-name">${u.username || 'Аноним'}</div>
                            <div class="user-bio">${u.bio || 'Без статуса'}</div>
                        </div>
                    </div>
                `).join('');

            } catch (err) {
                resultsList.innerHTML = `<div class="empty-state" style="color: var(--danger);">Ошибка поиска: ${err.message}</div>`;
            }
        }

        init();
    </script>
</body>
</html>
