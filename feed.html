<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Лента | Smart Social</title>
    <script src="config.js"></script>
    <script src="i18n.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg-primary: linear-gradient(135deg, #f5f0ff 0%, #e9d9ff 100%);
            --bg-secondary: #ffffff;
            --text-primary: #1e1e2f;
            --text-secondary: #6b6b80;
            --accent: #7c3aed;
            --border: #e9d9ff;
            --shadow: rgba(124, 58, 237, 0.1);
            --like-color: #ef4444;
        }
        [data-theme="dark"] {
            --bg-primary: linear-gradient(135deg, #1a0b2e 0%, #2d1b4e 100%);
            --bg-secondary: #2a1a3e;
            --text-primary: #f5f0ff;
            --text-secondary: #c4b5fd;
            --accent: #a78bfa;
            --border: #4c1d95;
            --shadow: rgba(167, 139, 250, 0.2);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; transition: all 0.3s ease; }
        body { font-family: system-ui, sans-serif; background: var(--bg-primary); min-height: 100vh; color: var(--text-primary); padding-bottom: 80px; }

        header { background: var(--bg-secondary); padding: 12px 20px; border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 100; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 2px 10px var(--shadow); }
        .logo { font-weight: 700; font-size: 20px; color: var(--accent); cursor: pointer; }
        .controls { display: flex; gap: 10px; align-items: center; }
        select { padding: 6px; border-radius: 8px; border: 1px solid var(--border); background: var(--bg-secondary); color: var(--text-primary); }
        .btn-sm { background: transparent; border: 1px solid var(--border); color: var(--text-secondary); padding: 6px 12px; border-radius: 16px; cursor: pointer; font-size: 13px; }

        .container { max-width: 600px; margin: 20px auto; padding: 0 16px; }

        .create-post { background: var(--bg-secondary); padding: 20px; border-radius: 16px; border: 1px solid var(--border); margin-bottom: 24px; box-shadow: 0 4px 12px var(--shadow); }
        textarea { width: 100%; border: none; resize: none; background: transparent; color: var(--text-primary); font-size: 16px; min-height: 80px; outline: none; margin-bottom: 12px; font-family: inherit; }
        .input-row input { width: 100%; padding: 10px; border: 1px solid var(--border); border-radius: 8px; background: var(--bg-primary); color: var(--text-primary); margin-bottom: 12px; }
        .actions { display: flex; justify-content: space-between; align-items: center; }
        .attach-btn { background: none; border: none; font-size: 24px; cursor: pointer; color: var(--text-secondary); }
        .publish-btn { background: var(--accent); color: white; border: none; padding: 10px 24px; border-radius: 20px; font-weight: 600; cursor: pointer; }
        .limit-info { font-size: 12px; color: var(--text-secondary); margin-top: 5px; text-align: right; }

        .feed-item { background: var(--bg-secondary); padding: 20px; border-radius: 16px; border: 1px solid var(--border); margin-bottom: 16px; box-shadow: 0 2px 8px var(--shadow); }
        .feed-header { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
        .avatar { width: 40px; height: 40px; border-radius: 50%; background: var(--border); display: flex; align-items: center; justify-content: center; font-size: 20px; }
        .username { font-weight: 600; font-size: 15px; }
        .timestamp { font-size: 12px; color: var(--text-secondary); margin-left: auto; }
        
        /* Стили для сворачивания текста */
        .post-content { font-size: 16px; line-height: 1.5; white-space: pre-wrap; margin-bottom: 12px; }
        .post-content.collapsed {
            display: -webkit-box;
            -webkit-line-clamp: 5; /* Количество строк */
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .read-more-btn { background: none; border: none; color: var(--accent); cursor: pointer; font-size: 14px; font-weight: 600; padding: 0; margin-bottom: 10px; }

        .post-image { width: 100%; border-radius: 12px; margin-top: 10px; max-height: 400px; object-fit: cover; }
        .media-box { margin-top: 12px; border: 1px solid var(--border); border-radius: 12px; overflow: hidden; background: #000; }
        .play-btn { width: 100%; padding: 15px; background: var(--bg-primary); border: none; color: var(--accent); font-weight: 600; cursor: pointer; }
        .player-frame { display: none; width: 100%; aspect-ratio: 16/9; background: #000; }
        .player-frame iframe, .player-frame video { width: 100%; height: 100%; border: none; }
        .player-frame audio { width: 100%; margin-top: 10px; }

        .post-footer { display: flex; align-items: center; gap: 20px; margin-top: 15px; padding-top: 15px; border-top: 1px solid var(--border); }
        .like-btn { background: none; border: none; cursor: pointer; font-size: 20px; display: flex; align-items: center; gap: 6px; color: var(--text-secondary); }
        .like-btn.liked { color: var(--like-color); }
        .edit-del { margin-left: auto; display: flex; gap: 10px; }
        .icon-btn { background: none; border: none; cursor: pointer; font-size: 18px; opacity: 0.6; }

        .angel-widget { position: fixed; bottom: 20px; right: 20px; z-index: 999; }
        .angel-bubble { width: 56px; height: 56px; border-radius: 50%; background: var(--accent); display: flex; align-items: center; justify-content: center; cursor: pointer; box-shadow: 0 4px 12px var(--shadow); font-size: 28px; color: white; }
        .angel-window { position: absolute; bottom: 70px; right: 0; width: 300px; background: var(--bg-secondary); border: 1px solid var(--border); border-radius: 16px; padding: 16px; box-shadow: 0 8px 32px var(--shadow); display: none; }
        .theme-toggle { position: fixed; bottom: 20px; left: 20px; width: 48px; height: 48px; border-radius: 50%; background: var(--bg-secondary); border: 1px solid var(--border); display: flex; align-items: center; justify-content: center; cursor: pointer; box-shadow: 0 4px 12px var(--shadow); font-size: 20px; z-index: 1000; }
    </style>
</head>
<body>

    <header>
        <div class="logo" onclick="location.reload()">Smart Social</div>
        <div class="controls">
            <select id="langSelect">
                <option value="ru">🇷 RU</option><option value="uk">🇺 UA</option><option value="en">🇬🇧 EN</option><option value="es">🇪 ES</option><option value="de">🇩 DE</option>
            </select>
            <button class="btn-sm" id="logoutBtn">Выйти</button>
        </div>
    </header>

    <div class="container">
        <div class="create-post">
            <textarea id="postContent" placeholder="Что у вас нового?"></textarea>
            <div class="input-row">
                <input type="url" id="postLink" placeholder="Ссылка (YouTube, MP3...)" />
            </div>
            <div class="actions">
                <div style="display:flex; align-items:center; gap:10px;">
                    <input type="file" id="imageInput" accept="image/*" style="display: none;">
                    <button class="attach-btn" onclick="document.getElementById('imageInput').click()">📷</button>
                    <span id="fileName" style="font-size: 12px; color: var(--text-secondary);"></span>
                </div>
                <button class="publish-btn" id="publishBtn">Опубликовать</button>
            </div>
            <div class="limit-info" id="limitInfo">Лимит: 10 постов в сутки</div>
        </div>
        <div id="feedList"></div>
    </div>

    <div class="angel-widget">
        <div class="angel-window" id="angelWindow">
            <div style="display:flex; justify-content:space-between; margin-bottom:10px;"><strong>Ангел-Хранитель</strong><span style="cursor:pointer;" onclick="document.getElementById('angelWindow').style.display='none'">✕</span></div>
            <p style="font-size:14px; color:var(--text-secondary)">Привет! Помни про лимит 10 постов. Качество важнее количества! 👋</p>
        </div>
        <div class="angel-bubble" onclick="document.getElementById('angelWindow').style.display='block'">👼</div>
    </div>
    <button class="theme-toggle" id="themeToggle">🌙</button>

    <script>
        if (typeof SUPABASE_URL === 'undefined') { alert('Ошибка конфига'); window.location.href = 'index.html'; }
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        const IMGBB_KEY = '6d207e02198a847a9a8d0a2a901485a5'; 
        let currentUser = null;

        // Theme & Lang
        const themeToggle = document.getElementById('themeToggle');
        if (localStorage.getItem('theme') === 'dark') { document.documentElement.setAttribute('data-theme', 'dark'); themeToggle.textContent = '☀️'; }
        themeToggle.onclick = () => {
            const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
            document.documentElement.setAttribute('data-theme', isDark ? 'light' : 'dark');
            themeToggle.textContent = isDark ? '🌙' : '☀️';
            localStorage.setItem('theme', isDark ? 'light' : 'dark');
        };
        const langSelect = document.getElementById('langSelect');
        langSelect.value = localStorage.getItem('lang') || 'ru';
        if (typeof applyLanguage === 'function') applyLanguage(langSelect.value);
        langSelect.onchange = (e) => { localStorage.setItem('lang', e.target.value); if(typeof applyLanguage === 'function') applyLanguage(e.target.value); };

        async function init() {
            const { data: { session } } = await supabase.auth.getSession();
            if (!session) return window.location.href = 'index.html';
            currentUser = session.user;
            checkNightMode();
            checkDailyLimit();
            loadPosts();
        }

        // Проверка лимита постов
        async function checkDailyLimit() {
            const today = new Date().toISOString().split('T')[0];
            const { count } = await supabase.from('posts').select('*', { count: 'exact', head: true }).eq('user_id', currentUser.id).gte('created_at', today);
            const info = document.getElementById('limitInfo');
            const btn = document.getElementById('publishBtn');
            if (count >= 10) {
                info.textContent = 'Лимит исчерпан на сегодня ✨';
                info.style.color = 'var(--like-color)';
                btn.disabled = true;
                btn.style.opacity = '0.5';
            } else {
                info.textContent = `Осталось постов сегодня: ${10 - count}`;
            }
        }

          function checkNightMode() {
            const hour = new Date().getHours();
            const btn = document.getElementById('publishBtn');
            const info = document.getElementById('limitInfo');
            
            if (hour >= 23 || hour < 7) {
                btn.disabled = true;
                btn.style.opacity = '0.5';
                btn.textContent = 'Ночной режим 🌙';
                if(info) info.textContent = 'Публикация доступна с 07:00 до 23:00';
            }
        }
        
        document.getElementById('logoutBtn').onclick = async () => { await supabase.auth.signOut(); window.location.href = 'index.html'; };

        async function uploadImage(file) {
            const formData = new FormData();
            formData.append("image", file);
            try {
                const res = await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_KEY}`, { method: "POST", body: formData });
                const data = await res.json();
                return data.success ? data.data.url : null;
            } catch (e) { return null; }
        }

      document.getElementById('publishBtn').onclick = async () => {
    // === ПРОВЕРКА НОЧНОГО РЕЖИМА (23:00 - 07:00) ===
    const hour = new Date().getHours();
    if (hour >= 23 || hour < 7) {
        alert('🌙 Ночной режим: с 23:00 до 07:00 публикация запрещена. Отдохни, мир подождёт твоих мыслей до утра!');
        return; // Прерываем выполнение, пост не отправится
    }
    // ==============================================

    const content = document.getElementById('postContent').value.trim();
    const link = document.getElementById('postLink').value.trim();
    const file = document.getElementById('imageInput').files[0];
    if (!content && !link && !file) return;

    const btn = document.getElementById('publishBtn');
    btn.disabled = true; btn.textContent = '...';
    const imgUrl = file ? await uploadImage(file) : null;

    const { error } = await supabase.from('posts').insert([{ user_id: currentUser.id, content, media_url: link, image_url: imgUrl }]);
    if (!error) {
        document.getElementById('postContent').value = '';
        document.getElementById('postLink').value = '';
        document.getElementById('imageInput').value = '';
        document.getElementById('fileName').textContent = '';
        checkDailyLimit();
        loadPosts();
    }
    btn.disabled = false; btn.textContent = 'Опубликовать';
};
        
        async function loadPosts() {
            const list = document.getElementById('feedList');
            list.innerHTML = '<div style="text-align:center; padding:20px;">Загрузка...</div>';
            
            const { data: posts } = await supabase.from('posts').select('*').order('created_at', { ascending: false });
            if (!posts) return;
            const { data: likes } = await supabase.from('likes').select('post_id, user_id');
            
            const html = await Promise.all(posts.map(async (post) => {
                const { data: u } = await supabase.from('users').select('username').eq('id', post.user_id).single();
                const author = u ? u.username : 'Unknown';
                const isOwner = post.user_id === currentUser.id;
                const postLikes = likes.filter(l => l.post_id === post.id);
                const isLiked = postLikes.some(l => l.user_id === currentUser.id);

                // Логика длинного текста
                const isLong = post.content.length > 300;
                const contentClass = isLong ? 'post-content collapsed' : 'post-content';
                const readMoreBtn = isLong ? `<button class="read-more-btn" onclick="toggleReadMore(this)">Читать еще...</button>` : '';

                let mediaHtml = '';
                if (post.image_url) mediaHtml += `<img src="${post.image_url}" class="post-image">`;
                if (post.media_url) {
                    const pid = `p-${post.id}`;
                    let embed = '';
                    const yt = post.media_url.match(/(?:youtube\.com\/watch\?v=|youtu\.be\/)([a-zA-Z0-9_-]+)/);
                    if (yt) embed = `<iframe src="https://www.youtube.com/embed/${yt[1]}" allowfullscreen></iframe>`;
                    else if (post.media_url.match(/\.(mp3|wav|ogg)$/i)) embed = `<div style="padding:20px; background:#fff;"><audio controls src="${post.media_url}" style="width:100%"></audio></div>`;
                    else if (post.media_url.match(/\.(mp4|webm)$/i)) embed = `<video controls src="${post.media_url}"></video>`;
                    else embed = `<div style="padding:20px; text-align:center; background:#fff;"><a href="${post.media_url}" target="_blank" style="color:var(--accent)">🔗 Открыть ссылку</a></div>`;
                    mediaHtml += `<div class="media-box"><button class="play-btn" onclick="toggleMedia('${pid}', this)">▶ Играть / Показать</button><div id="${pid}" class="player-frame">${embed}</div></div>`;
                }

                return `
                <div class="feed-item">
                    <div class="feed-header">
                        <div class="avatar">👤</div>
                        <span class="username">${author}</span>
                        <span class="timestamp">${new Date(post.created_at).toLocaleString()}</span>
                    </div>
                    <div class="${contentClass}">${post.content}</div>
                    ${readMoreBtn}
                    ${mediaHtml}
                    <div class="post-footer">
                        <button class="like-btn ${isLiked ? 'liked' : ''}" onclick="toggleLike('${post.id}', this)">
                            ${isLiked ? '❤️' : '🤍'} <span>${postLikes.length}</span>
                        </button>
                        ${isOwner ? `<div class="edit-del">
                            <button class="icon-btn" onclick="editPost('${post.id}', \`${post.content.replace(/`/g, '\\`')}\`)">✏️</button>
                            <button class="icon-btn" onclick="deletePost('${post.id}')">🗑️</button>
                        </div>` : ''}
                    </div>
                </div>`;
            }));
            list.innerHTML = html.join('');
        }

        window.toggleReadMore = (btn) => {
            const content = btn.previousElementSibling;
            if (content.classList.contains('collapsed')) {
                content.classList.remove('collapsed');
                btn.textContent = 'Свернуть';
            } else {
                content.classList.add('collapsed');
                btn.textContent = 'Читать еще...';
            }
        };

        window.toggleMedia = (id, btn) => {
            const el = document.getElementById(id);
            if (el.style.display === 'block') {
                el.style.display = 'none';
                btn.innerHTML = '▶ Играть / Показать';
                const media = el.querySelector('iframe, audio, video');
                if(media) { if(media.pause) media.pause(); if(media.tagName==='IFRAME') { const s=media.src; media.src=''; media.src=s; } }
            } else {
                el.style.display = 'block';
                btn.innerHTML = '⏸ Скрыть';
            }
        };

        window.toggleLike = async (postId, btn) => {
            const { data: existing } = await supabase.from('likes').select('*').eq('post_id', postId).eq('user_id', currentUser.id).single();
            if (existing) await supabase.from('likes').delete().eq('id', existing.id);
            else await supabase.from('likes').insert([{ post_id: postId, user_id: currentUser.id }]);
            loadPosts();
        };

        window.deletePost = async (id) => { if(confirm('Удалить?')) { await supabase.from('posts').delete().eq('id', id); checkDailyLimit(); loadPosts(); } };
        window.editPost = async (id, text) => { const t = prompt('Редактировать:', text); if(t!==null && t!==text) { await supabase.from('posts').update({content:t}).eq('id', id); loadPosts(); } };

        init();
    </script>
</body>
</html>
