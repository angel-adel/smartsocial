<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Social — Лента</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: system-ui, sans-serif;
            background: #f5f0ff;
            padding: 20px;
            min-height: 100vh;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
        }
        .card {
            background: white;
            border-radius: 24px;
            padding: 20px;
            margin-bottom: 16px;
            border: 1px solid #e9d9ff;
        }
        .post {
            border-bottom: 1px solid #eee;
            padding: 12px 0;
        }
        .post:last-child { border-bottom: none; }
        .username {
            font-weight: bold;
            color: #007bff;
            text-decoration: none;
        }
        .date {
            font-size: 11px;
            color: #888;
        }
        .post-content {
            white-space: pre-wrap;
            word-wrap: break-word;
            margin: 6px 0 8px;
        }
        .post-footer {
            display: flex;
            gap: 12px;
            margin-top: 6px;
        }
        .like-btn {
            background: none;
            border: none;
            font-size: 18px;
            cursor: pointer;
            padding: 0;
            color: #666;
        }
        .like-btn.active {
            color: #007bff;
        }
        .media-link {
            color: #007bff;
            text-decoration: none;
            font-weight: 500;
        }
        .media-link:hover {
            text-decoration: underline;
        }

        #debug-log {
            background: #fff3cd;
            border-radius: 8px;
            padding: 10px;
            font-size: 0.8em;
            word-break: break-all;
            text-align: left;
            border: 1px solid #ffc107;
            color: #1e1e2f;
            max-height: 150px;
            overflow-y: auto;
            font-family: monospace;
            margin-bottom: 16px;
        }
        .log-entry { margin: 2px 0; }
        .log-error { color: #b33c3c; }
        .log-success { color: #2d7d2d; }
        .log-info { color: #0056b3; }

        .header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .logout-link {
            color: red;
            text-decoration: none;
            font-size: 14px;
        }
        .user-badge {
            font-size: 14px;
            color: #007bff;
        }
        textarea, input {
            width: 100%;
            padding: 12px;
            border-radius: 14px;
            border: 1px solid #ddd;
            font-size: 16px;
            font-family: system-ui;
        }
        button {
            background: #007bff;
            color: white;
            border: none;
            border-radius: 14px;
            padding: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
        }
        button:hover { background: #0056b3; }
        .night-mode {
            background: #121212 !important;
            color: #e0e0e0 !important;
        }
        .night-mode .card {
            background: #1e1e1e !important;
            border-color: #333 !important;
        }
        .night-mode #debug-log {
            background: #2c2c2c;
            color: #e0e0e0;
            border-color: #444;
        }
        .night-mode .post {
            border-color: #333;
        }
        .night-mode .username { color: #bb86fc; }
        .night-mode .date { color: #9e9e9e; }
        .night-mode .like-btn { color: #9e9e9e; }
        .night-mode .like-btn.active { color: #bb86fc; }
        .night-mode button { background: #bb86fc; color: #121212; }
        .night-mode textarea,
        .night-mode input {
            background: #2c2c2c;
            color: #e0e0e0;
            border-color: #444;
        }
        .night-mode .log-error { color: #ff6b6b; }
        .night-mode .log-success { color: #8bc34a; }
        .night-mode .log-info { color: #64b5f6; }
    </style>
</head>
<body>

    <div class="container">

        <!-- Диагностическая консоль -->
        <div id="debug-log">⏳ Ожидание действий...</div>

        <!-- Шапка -->
        <div class="card">
            <div class="header-row">
                <h3 style="margin:0;">📰 Лента</h3>
                <span class="user-badge" id="userBadge">@</span>
                <a href="#" id="logoutBtn" class="logout-link">Выйти</a>
            </div>
        </div>

        <!-- Форма публикации -->
        <div class="card" id="postForm">
            <textarea id="postContent" rows="3" placeholder="Что нового?"></textarea>
            <input type="text" id="postMedia" placeholder="Ссылка на видео / аудио..." style="margin-top:8px;" />
            <button id="postSubmitBtn" style="margin-top:8px;">Опубликовать</button>
            <div id="nightStatus" style="margin-top:8px; font-size:14px; color:#888;"></div>
        </div>

        <!-- Контейнер постов -->
        <div class="card" id="postsContainer">
            <div id="postsList">Загрузка...</div>
        </div>

    </div>

    <script>
        // ===== КЛЮЧИ ИЗ CONFIG.JS =====
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // ===== КОНСОЛЬ =====
        function log(msg, type = 'info') {
            const box = document.getElementById('debug-log');
            const entry = document.createElement('div');
            entry.className = `log-entry log-${type}`;
            entry.textContent = '🔹 ' + msg;
            box.appendChild(entry);
            box.scrollTop = box.scrollHeight;
            console.log('[Feed]', msg);
        }

        // ===== НОЧНОЙ РЕЖИМ =====
        function checkNightMode() {
            const now = new Date();
            const mskHour = (now.getUTCHours() + 3) % 24;
            const isNight = mskHour >= 23 || mskHour < 7;
            document.body.classList.toggle('night-mode', isNight);

            const status = document.getElementById('nightStatus');
            const btn = document.getElementById('postSubmitBtn');
            if (isNight) {
                status.textContent = '🌙 Спящий режим: публикация недоступна с 23:00 до 07:00';
                btn.disabled = true;
                btn.style.opacity = 0.5;
                log('🌙 Ночной режим активен', 'info');
            } else {
                status.textContent = '☀️ Можно публиковать';
                btn.disabled = false;
                btn.style.opacity = 1;
                log('☀️ Дневной режим', 'info');
            }
        }

        // ===== ПРОВЕРКА СЕССИИ =====
        let currentUser = null;

        async function checkSession() {
            log('🔍 Проверка сессии...');
            const { data, error } = await supabase.auth.getSession();
            if (error) {
                log('❌ Ошибка сессии: ' + error.message, 'error');
                return;
            }
            if (data.session) {
                currentUser = data.session.user;
                const username = currentUser.user_metadata?.username || currentUser.email?.split('@')[0] || 'user';
                log('✅ Сессия активна: ' + username, 'success');
                document.getElementById('userBadge').textContent = '@' + username;
                loadPosts();
            } else {
                log('🔴 Сессии нет, перенаправление на вход...', 'error');
                window.location.href = 'index.html';
            }
        }

        // ===== ЗАГРУЗКА ПОСТОВ =====
        async function loadPosts() {
            const list = document.getElementById('postsList');
            log('📡 Запрос постов...');
            list.innerHTML = '⏳ Загрузка...';

            const { data, error } = await supabase
                .from('posts')
                .select('id, content, media_url, created_at, user_id, users!inner(username)')
                .order('created_at', { ascending: false })
                .limit(20);

            if (error) {
                log('❌ Ошибка загрузки: ' + error.message, 'error');
                list.innerHTML = '<p style="color:red;">Ошибка загрузки постов</p>';
                return;
            }

            if (!data || data.length === 0) {
                log('📭 Постов нет', 'info');
                list.innerHTML = '<p>Нет постов. Будьте первым!</p>';
                return;
            }

            log('✅ Загружено ' + data.length + ' постов', 'success');
            let html = '';
            data.forEach(post => {
                const username = post.users?.username || 'Unknown';
                const dateStr = new Date(post.created_at).toLocaleString('ru-RU');
                html += `
                    <div class="post">
                        <div>
                            <a href="profile.html?user=${encodeURIComponent(username)}" class="username">@${username}</a>
                        </div>
                        <div class="post-content">${post.content}</div>
                        ${post.media_url ? `<a href="${post.media_url}" target="_blank" class="media-link">▶ Медиа</a>` : ''}
                        <div class="post-footer">
                            <button class="like-btn" data-post="${post.id}">❤️ 0</button>
                            <span class="date">${dateStr}</span>
                        </div>
                    </div>
                `;
            });
            list.innerHTML = html;
        }

        // ===== ПУБЛИКАЦИЯ =====
        async function addPost() {
            const content = document.getElementById('postContent').value.trim();
            const media_url = document.getElementById('postMedia').value.trim();

            if (!content) {
                log('⚠️ Пустой пост', 'error');
                alert('Напишите текст');
                return;
            }

            if (!currentUser) {
                log('❌ Пользователь не авторизован', 'error');
                alert('Вы не авторизованы');
                return;
            }

            const now = new Date();
            const mskHour = (now.getUTCHours() + 3) % 24;
            if (mskHour >= 23 || mskHour < 7) {
                log('🌙 Публикация запрещена ночью', 'error');
                alert('Публикация недоступна с 23:00 до 07:00');
                return;
            }

            log('📤 Публикация... (' + content.length + ' символов)');
            const { error } = await supabase.from('posts').insert([{
                user_id: currentUser.id,
                content: content,
                media_url: media_url || null,
                created_at: new Date().toISOString()
            }]);

            if (error) {
                log('❌ Ошибка публикации: ' + error.message, 'error');
                alert('Ошибка: ' + error.message);
                return;
            }

            log('✅ Пост опубликован', 'success');
            document.getElementById('postContent').value = '';
            document.getElementById('postMedia').value = '';
            loadPosts();
        }

        // ===== ВЫХОД =====
        async function logout() {
            log('🚪 Выход...');
            await supabase.auth.signOut();
            window.location.href = 'index.html';
        }

        // ===== СОБЫТИЯ =====
        document.getElementById('postSubmitBtn').addEventListener('click', addPost);
        document.getElementById('logoutBtn').addEventListener('click', logout);

        // ===== ЗАПУСК =====
        document.addEventListener('DOMContentLoaded', () => {
            log('🚀 Feed загружен');
            checkNightMode();
            checkSession();
        });
    </script>
</body>
              </html>
