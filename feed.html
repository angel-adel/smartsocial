<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Лента | Smart Social</title>
    <script src="config.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg-primary: linear-gradient(135deg, #f5f0ff 0%, #e9d9ff 100%);
            --bg-secondary: #ffffff;
            --text-primary: #1e1e2f;
            --text-secondary: #6b6b80;
            --accent: #7c3aed;
            --accent-hover: #6d28d9;
            --border: #e9d9ff;
            --shadow: rgba(124, 58, 237, 0.1);
        }
        [data-theme="dark"] {
            --bg-primary: linear-gradient(135deg, #1a0b2e 0%, #2d1b4e 100%);
            --bg-secondary: #2a1a3e;
            --text-primary: #f5f0ff;
            --text-secondary: #c4b5fd;
            --accent: #a78bfa;
            --accent-hover: #c4b5fd;
            --border: #4c1d95;
            --shadow: rgba(167, 139, 250, 0.2);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; transition: all 0.3s ease; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
            background: var(--bg-primary);
            min-height: 100vh;
            color: var(--text-primary);
            padding-bottom: 40px;
        }
        header {
            background: var(--bg-secondary);
            padding: 16px 20px;
            border-bottom: 1px solid var(--border);
            position: sticky; top: 0; z-index: 100;
            display: flex; justify-content: space-between; align-items: center;
            box-shadow: 0 2px 10px var(--shadow);
        }
        .logo { font-weight: 700; font-size: 20px; color: var(--accent); }
        .logout-btn {
            background: transparent; border: 1px solid var(--border);
            color: var(--text-secondary); padding: 8px 16px;
            border-radius: 20px; cursor: pointer; font-size: 14px;
        }
        .container { max-width: 600px; margin: 20px auto; padding: 0 16px; }
        
        /* Форма */
        .create-post {
            background: var(--bg-secondary); padding: 20px;
            border-radius: 16px; border: 1px solid var(--border);
            margin-bottom: 24px; box-shadow: 0 4px 12px var(--shadow);
        }
        .create-post textarea {
            width: 100%; border: none; resize: none; background: transparent;
            color: var(--text-primary); font-size: 16px; min-height: 80px;
            outline: none; margin-bottom: 12px; font-family: inherit;
        }
        .input-group { margin-bottom: 12px; }
        .input-group input {
            width: 100%; padding: 10px; border: 1px solid var(--border);
            border-radius: 8px; background: var(--bg-primary); color: var(--text-primary);
        }
        .post-actions { display: flex; justify-content: space-between; align-items: center; }
        .attach-btn {
            background: none; border: none; font-size: 24px; cursor: pointer;
            color: var(--text-secondary);
        }
        .publish-btn {
            background: var(--accent); color: white; border: none;
            padding: 10px 24px; border-radius: 20px; font-weight: 600; cursor: pointer;
        }
        
        /* Посты */
        .feed-item {
            background: var(--bg-secondary); padding: 20px;
            border-radius: 16px; border: 1px solid var(--border);
            margin-bottom: 16px; box-shadow: 0 2px 8px var(--shadow);
        }
        .feed-header { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
        .avatar { width: 40px; height: 40px; border-radius: 50%; background: var(--border); }
        .username { font-weight: 600; font-size: 15px; }
        .timestamp { font-size: 12px; color: var(--text-secondary); margin-left: auto; }
        .post-content { font-size: 16px; line-height: 1.5; white-space: pre-wrap; margin-bottom: 12px; }
        
        /* Медиа */
        .post-image {
            width: 100%; border-radius: 12px; margin-top: 10px;
            max-height: 400px; object-fit: cover;
        }
        .post-link {
            display: block; padding: 12px; background: var(--bg-primary);
            border-radius: 8px; text-decoration: none; color: var(--accent);
            margin-top: 10px; font-size: 14px; word-break: break-all;
            border: 1px solid var(--border);
        }
        .post-audio { width: 100%; margin-top: 10px; outline: none; }

        .theme-toggle {
            position: fixed; bottom: 20px; right: 20px;
            width: 48px; height: 48px; border-radius: 50%;
            background: var(--bg-secondary); border: 1px solid var(--border);
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; box-shadow: 0 4px 12px var(--shadow);
            font-size: 20px; z-index: 1000;
        }
    </style>
</head>
<body>
    <header>
        <div class="logo">Smart Social</div>
        <button class="logout-btn" id="logoutBtn">Выйти</button>
    </header>

    <div class="container">
        <div class="create-post">
            <textarea id="postContent" placeholder="Что у вас нового?"></textarea>
            
            <!-- Поле для ссылки -->
            <div class="input-group">
                <input type="url" id="postLink" placeholder="Ссылка на музыку или сайт (https://...)" />
            </div>

            <div class="post-actions">
                <!-- Кнопка фото -->
                <input type="file" id="imageInput" accept="image/*" style="display: none;">
                <button class="attach-btn" onclick="document.getElementById('imageInput').click()" title="Прикрепить фото"></button>
                <span id="fileName" style="font-size: 12px; color: var(--text-secondary);"></span>
                
                <button class="publish-btn" id="publishBtn">Опубликовать</button>
            </div>
        </div>

        <div id="feedList">
            <div style="text-align: center; color: var(--text-secondary); padding: 20px;">Загрузка...</div>
        </div>
    </div>

    <button class="theme-toggle" id="themeToggle">🌙</button>

    <script>
        // ===== ТЕМА =====
        const themeToggle = document.getElementById('themeToggle');
        if (localStorage.getItem('theme') === 'dark') {
            document.documentElement.setAttribute('data-theme', 'dark');
            themeToggle.textContent = '☀️';
        }
        themeToggle.addEventListener('click', () => {
            const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
            if (isDark) {
                document.documentElement.removeAttribute('data-theme');
                themeToggle.textContent = '🌙';
                localStorage.setItem('theme', 'light');
            } else {
                document.documentElement.setAttribute('data-theme', 'dark');
                themeToggle.textContent = '☀️';
                localStorage.setItem('theme', 'dark');
            }
        });

        // ===== SUPABASE =====
        if (typeof SUPABASE_URL === 'undefined') {
            alert('Ошибка конфига');
            window.location.href = 'index.html';
        }
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        let currentUser = null;

        // ===== FREEIMAGEHOST API KEY =====
        // Вставь сюда свой ключ с freeimage.host
        const IMG_API_KEY = '6d207e02198a847aa98d0a2a901485a5'; 

        // ===== AUTH =====
        async function checkAuth() {
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (!session) return window.location.href = 'index.html';
            currentUser = session.user;
            loadPosts();
        }

        document.getElementById('logoutBtn').addEventListener('click', async () => {
            await supabaseClient.auth.signOut();
            window.location.href = 'index.html';
        });

        // ===== ЗАГРУЗКА ИЗОБРАЖЕНИЯ =====
        document.getElementById('imageInput').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                document.getElementById('fileName').textContent = file.name;
            }
        });

        async function uploadImage(file) {
            const formData = new FormData();
            formData.append("source", file);
            formData.append("key", IMG_API_KEY);
            formData.append("action", "upload");

            try {
                const response = await fetch("https://freeimage.host/api/1/upload", {
                    method: "POST",
                    body: formData
                });
                const data = await response.json();
                if (data.status_code === 200) {
                    return data.image.url;
                } else {
                    throw new Error(data.error.message);
                }
            } catch (err) {
                console.error("Upload error:", err);
                alert("Ошибка загрузки фото: " + err.message);
                return null;
            }
        }

        // ===== СОЗДАНИЕ ПОСТА =====
        document.getElementById('publishBtn').addEventListener('click', async () => {
            const content = document.getElementById('postContent').value.trim();
            const link = document.getElementById('postLink').value.trim();
            const fileInput = document.getElementById('imageInput');
            const file = fileInput.files[0];
            
            if (!content && !link && !file) return;

            const btn = document.getElementById('publishBtn');
            btn.disabled = true;
            btn.textContent = 'Отправка...';

            let imageUrl = null;
            if (file) {
                imageUrl = await uploadImage(file);
                if (!imageUrl) {
                    btn.disabled = false;
                    btn.textContent = 'Опубликовать';
                    return; // Ошибка загрузки
                }
            }

            const { error } = await supabaseClient.from('posts').insert([{
                user_id: currentUser.id,
                content: content,
                link_url: link,
                image_url: imageUrl
            }]);

            if (error) {
                alert('Ошибка БД: ' + error.message);
            } else {
                document.getElementById('postContent').value = '';
                document.getElementById('postLink').value = '';
                fileInput.value = '';
                document.getElementById('fileName').textContent = '';
                loadPosts();
            }
            btn.disabled = false;
            btn.textContent = 'Опубликовать';
        });

        // ===== ЛЕНТА =====
        async function loadPosts() {
            const feedList = document.getElementById('feedList');
            feedList.innerHTML = '<div style="text-align:center; padding:20px;">Загрузка...</div>';

            const { data, error } = await supabaseClient
                .from('posts')
                .select('*')
                .order('created_at', { ascending: false });

            if (error) return feedList.innerHTML = `<div style="color:red">${error.message}</div>`;
            if (!data.length) return feedList.innerHTML = '<div style="text-align:center; padding:20px;">Постов нет</div>';

            feedList.innerHTML = data.map(post => {
                const isOwner = post.user_id === currentUser.id;
                
                // Рендер медиа
                let mediaHtml = '';
                if (post.image_url) {
                    mediaHtml += `<img src="${post.image_url}" class="post-image" alt="Post image">`;
                }
                if (post.link_url) {
                    // Простая проверка на аудио
                    if (post.link_url.match(/\.(mp3|wav|ogg)$/i)) {
                        mediaHtml += `<audio controls src="${post.link_url}" class="post-audio"></audio>`;
                    } else {
                        mediaHtml += `<a href="${post.link_url}" target="_blank" class="post-link">🔗 ${post.link_url}</a>`;
                    }
                }

                const controls = isOwner ? `
                    <div style="margin-left:auto; display:flex; gap:8px;">
                        <button onclick="deletePost('${post.id}')" style="background:none; border:none; cursor:pointer;">🗑️</button>
                    </div>
                ` : '';

                return `
                <div class="feed-item">
                    <div class="feed-header">
                        <div class="avatar"></div>
                        <span class="username">User</span>
                        <span class="timestamp">${new Date(post.created_at).toLocaleString()}</span>
                        ${controls}
                    </div>
                    <div class="post-content">${post.content}</div>
                    ${mediaHtml}
                </div>
                `;
            }).join('');
        }

        window.deletePost = async function(id) {
            if (!confirm('Удалить пост?')) return;
            await supabaseClient.from('posts').delete().eq('id', id);
            loadPosts();
        };

        checkAuth();
    </script>
</body>
</html>
