<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Лента | Smart Social</title>
    
    <!-- Конфиг и библиотеки -->
    <script src="config.js"></script>
    <script src="i18n.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        :root {
            --bg-primary: linear-gradient(135deg, #f5f0ff 0%, #e9d9ff 100%);
            --bg-secondary: #ffffff;
            --text-primary: #1e1e2f;
            --text-secondary: #6b6b80;
            --accent: #7c3aed;
            --accent-hover: #6d28d9;
            --border: #e9d9ff;
            --shadow: rgba(124, 58, 237, 0.1);
        }
        [data-theme="dark"] {
            --bg-primary: linear-gradient(135deg, #1a0b2e 0%, #2d1b4e 100%);
            --bg-secondary: #2a1a3e;
            --text-primary: #f5f0ff;
            --text-secondary: #c4b5fd;
            --accent: #a78bfa;
            --accent-hover: #c4b5fd;
            --border: #4c1d95;
            --shadow: rgba(167, 139, 250, 0.2);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; transition: all 0.3s ease; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
            background: var(--bg-primary);
            min-height: 100vh;
            color: var(--text-primary);
            padding-bottom: 60px;
        }

        /* Шапка */
        header {
            background: var(--bg-secondary);
            padding: 12px 20px;
            border-bottom: 1px solid var(--border);
            position: sticky; top: 0; z-index: 100;
            display: flex; justify-content: space-between; align-items: center;
            box-shadow: 0 2px 10px var(--shadow);
        }
        .logo { font-weight: 700; font-size: 20px; color: var(--accent); cursor: pointer; }
        .header-controls { display: flex; gap: 10px; align-items: center; }
        
        select#langSelect {
            padding: 6px; border-radius: 8px; border: 1px solid var(--border);
            background: var(--bg-secondary); color: var(--text-primary); font-size: 12px;
        }

        .btn-sm {
            background: transparent; border: 1px solid var(--border);
            color: var(--text-secondary); padding: 6px 12px;
            border-radius: 16px; cursor: pointer; font-size: 13px;
        }
        .btn-sm:hover { border-color: var(--accent); color: var(--accent); }

        /* Контейнер */
        .container { max-width: 600px; margin: 20px auto; padding: 0 16px; }

        /* Форма поста */
        .create-post {
            background: var(--bg-secondary); padding: 20px;
            border-radius: 16px; border: 1px solid var(--border);
            margin-bottom: 24px; box-shadow: 0 4px 12px var(--shadow);
        }
        .create-post textarea {
            width: 100%; border: none; resize: none; background: transparent;
            color: var(--text-primary); font-size: 16px; min-height: 80px;
            outline: none; margin-bottom: 12px; font-family: inherit;
        }
        .input-row { display: flex; gap: 10px; margin-bottom: 12px; }
        .input-row input {
            flex: 1; padding: 10px; border: 1px solid var(--border);
            border-radius: 8px; background: var(--bg-primary); color: var(--text-primary);
        }
        .post-actions { display: flex; justify-content: space-between; align-items: center; }
        .attach-btn { background: none; border: none; font-size: 24px; cursor: pointer; color: var(--text-secondary); }
        .publish-btn {
            background: var(--accent); color: white; border: none;
            padding: 10px 24px; border-radius: 20px; font-weight: 600; cursor: pointer;
        }
        .publish-btn:disabled { opacity: 0.6; cursor: not-allowed; }

        /* Лента */
        .feed-item {
            background: var(--bg-secondary); padding: 20px;
            border-radius: 16px; border: 1px solid var(--border);
            margin-bottom: 16px; box-shadow: 0 2px 8px var(--shadow);
        }
        .feed-header { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
        .avatar { width: 40px; height: 40px; border-radius: 50%; background: var(--border); display:flex; align-items:center; justify-content:center; font-size:20px;}
        .username { font-weight: 600; font-size: 15px; }
        .timestamp { font-size: 12px; color: var(--text-secondary); margin-left: auto; }
        .post-content { font-size: 16px; line-height: 1.5; white-space: pre-wrap; margin-bottom: 12px; }
        
        /* Медиа */
        .post-image { width: 100%; border-radius: 12px; margin-top: 10px; max-height: 400px; object-fit: cover; }
        .media-player-box { margin-top: 12px; border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
        .play-trigger {
            width: 100%; padding: 12px; background: var(--bg-primary);
            border: none; color: var(--accent); font-weight: 600; cursor: pointer;
            display: flex; align-items: center; justify-content: center; gap: 8px;
        }
        .player-frame { display: none; width: 100%; background: #000; }
        .player-frame iframe, .player-frame audio, .player-frame video { width: 100%; display: block; border: none; }
        .player-frame audio { height: 50px; }

        /* Ангел */
        .angel-widget { position: fixed; bottom: 20px; right: 20px; z-index: 999; }
        .angel-bubble {
            width: 56px; height: 56px; border-radius: 50%; background: var(--accent);
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; box-shadow: 0 4px 12px var(--shadow); font-size: 28px; color: white;
        }
        .angel-window {
            position: absolute; bottom: 70px; right: 0; width: 300px;
            background: var(--bg-secondary); border: 1px solid var(--border);
            border-radius: 16px; padding: 16px; box-shadow: 0 8px 32px var(--shadow);
            display: none;
        }
        .angel-window.active { display: block; }

        /* Тема */
        .theme-toggle {
            position: fixed; bottom: 20px; left: 20px;
            width: 48px; height: 48px; border-radius: 50%;
            background: var(--bg-secondary); border: 1px solid var(--border);
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; box-shadow: 0 4px 12px var(--shadow); font-size: 20px; z-index: 1000;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo" onclick="location.reload()">Smart Social</div>
        <div class="header-controls">
            <select id="langSelect">
                <option value="ru">🇷 RU</option>
                <option value="uk">🇺🇦 UA</option>
                <option value="en">🇬🇧 EN</option>
                <option value="es">🇪🇸 ES</option>
                <option value="de">🇩🇪 DE</option>
            </select>
            <button class="btn-sm" id="logoutBtn">Выйти</button>
        </div>
    </header>

    <div class="container">
        <!-- Форма -->
        <div class="create-post">
            <textarea id="postContent" placeholder="Что у вас нового?"></textarea>
            <div class="input-row">
                <input type="url" id="postLink" placeholder="Ссылка (YouTube, MP3...)" />
            </div>
            <div class="post-actions">
                <div style="display:flex; align-items:center; gap:10px;">
                    <input type="file" id="imageInput" accept="image/*" style="display: none;">
                    <button class="attach-btn" onclick="document.getElementById('imageInput').click()" title="Фото">📷</button>
                    <span id="fileName" style="font-size: 12px; color: var(--text-secondary); max-width: 100px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;"></span>
                </div>
                <button class="publish-btn" id="publishBtn">Опубликовать</button>
            </div>
        </div>

        <!-- Лента -->
        <div id="feedList">
            <div style="text-align: center; color: var(--text-secondary); padding: 20px;">Загрузка...</div>
        </div>
    </div>

    <!-- Ангел -->
    <div class="angel-widget">
        <div class="angel-window" id="angelWindow">
            <div style="display:flex; justify-content:space-between; margin-bottom:10px;">
                <strong>Ангел-Хранитель</strong>
                <span style="cursor:pointer;" onclick="document.getElementById('angelWindow').classList.remove('active')">✕</span>
            </div>
            <p style="font-size:14px; color:var(--text-secondary)">Привет! Я слежу за твоими постами. Если нужна помощь — пиши в поддержку. 👋</p>
        </div>
        <div class="angel-bubble" onclick="document.getElementById('angelWindow').classList.toggle('active')">👼</div>
    </div>

    <button class="theme-toggle" id="themeToggle">🌙</button>

    <script>
        // ===== КОНФИГ =====
        if (typeof SUPABASE_URL === 'undefined') {
            alert('Ошибка: config.js не найден');
            window.location.href = 'index.html';
        }
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        let currentUser = null;
        let currentUsername = 'User';

        // ===== ТЕМА И ЯЗЫК =====
        const themeToggle = document.getElementById('themeToggle');
        if (localStorage.getItem('theme') === 'dark') {
            document.documentElement.setAttribute('data-theme', 'dark');
            themeToggle.textContent = '☀️';
        }
        themeToggle.addEventListener('click', () => {
            const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
            if (isDark) {
                document.documentElement.removeAttribute('data-theme');
                themeToggle.textContent = '🌙';
                localStorage.setItem('theme', 'light');
            } else {
                document.documentElement.setAttribute('data-theme', 'dark');
                themeToggle.textContent = '☀️';
                localStorage.setItem('theme', 'dark');
            }
        });

        const langSelect = document.getElementById('langSelect');
        const savedLang = localStorage.getItem('lang') || 'ru';
        langSelect.value = savedLang;
        if (typeof applyLanguage === 'function') applyLanguage(savedLang);
        
        langSelect.addEventListener('change', (e) => {
            localStorage.setItem('lang', e.target.value);
            if (typeof applyLanguage === 'function') applyLanguage(e.target.value);
        });

        // ===== AUTH =====
        async function checkAuth() {
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (!session) return window.location.href = 'index.html';
            currentUser = session.user;
            
            // Получаем имя из таблицы users
            const { data: userData } = await supabaseClient.from('users').select('username').eq('id', currentUser.id).single();
            if (userData) currentUsername = userData.username;

            loadPosts();
        }

        document.getElementById('logoutBtn').addEventListener('click', async () => {
            await supabaseClient.auth.signOut();
            window.location.href = 'index.html';
        });

        // ===== ФОТО =====
        document.getElementById('imageInput').addEventListener('change', function(e) {
            const file = e.target.files[0];
            document.getElementById('fileName').textContent = file ? file.name : '';
        });

async function uploadImage(file) {
    // Твой ключ ImgBB
    const IMGBB_KEY = '15cba85a1a5259f80f5326d1fb9bd1f1'; 
    
    const formData = new FormData();
    formData.append("image", file); // ImgBB требует поле "image"

    try {
        console.log('📤 Отправка на ImgBB...');
        // URL эндпоинта ImgBB + ключ в параметрах
        const res = await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_KEY}`, {
            method: "POST",
            body: formData
        });
        const data = await res.json();
        
        console.log('Ответ ImgBB:', data);

        if (data.success) {
            console.log('✅ Фото загружено:', data.data.url);
            return data.data.url;
        } else {
            throw new Error(data.error ? data.error.message : 'Ошибка загрузки');
        }
    } catch (e) {
        console.error('❌ Ошибка ImgBB:', e);
        alert('Ошибка загрузки фото: ' + e.message);
        return null;
    }
}
        // ===== ПОСТЫ =====
        document.getElementById('publishBtn').addEventListener('click', async () => {
            const content = document.getElementById('postContent').value.trim();
            const link = document.getElementById('postLink').value.trim();
            const file = document.getElementById('imageInput').files[0];
            
            if (!content && !link && !file) return;

            const btn = document.getElementById('publishBtn');
            btn.disabled = true; btn.textContent = '...';

            let imgUrl = null;
            if (file) imgUrl = await uploadImage(file);

            const { error } = await supabaseClient.from('posts').insert([{
                user_id: currentUser.id,
                content,
                media_url: link, // Используем media_url как в твоей БД
                image_url: imgUrl
            }]);

            if (error) alert('Ошибка: ' + error.message);
            else {
                document.getElementById('postContent').value = '';
                document.getElementById('postLink').value = '';
                document.getElementById('imageInput').value = '';
                document.getElementById('fileName').textContent = '';
                loadPosts();
            }
            btn.disabled = false; btn.textContent = 'Опубликовать';
        });

        async function loadPosts() {
            const feedList = document.getElementById('feedList');
            feedList.innerHTML = '<div style="text-align:center; padding:20px;">Загрузка...</div>';

            const { data, error } = await supabaseClient.from('posts').select('*').order('created_at', { ascending: false });
            if (error) return feedList.innerHTML = `<div style="color:red">${error.message}</div>`;
            if (!data.length) return feedList.innerHTML = '<div style="text-align:center; padding:20px;">Постов нет</div>';

            // Подгружаем имена для всех постов
            const postsWithAuthors = await Promise.all(data.map(async (post) => {
                const { data: u } = await supabaseClient.from('users').select('username').eq('id', post.user_id).single();
                return { ...post, author: u ? u.username : 'Unknown' };
            }));

            feedList.innerHTML = postsWithAuthors.map(post => {
                const isOwner = post.user_id === currentUser.id;
                
                // Медиа логика
                let mediaHtml = '';
                if (post.image_url) mediaHtml += `<img src="${post.image_url}" class="post-image">`;
                
                if (post.media_url) {
                    const pid = `p-${post.id}`;
                    let embed = '';
                    const yt = post.media_url.match(/(?:youtube\.com\/watch\?v=|youtu\.be\/)([a-zA-Z0-9_-]+)/);
                    
                    if (yt) embed = `<iframe height="200" src="https://www.youtube.com/embed/${yt[1]}"></iframe>`;
                    else if (post.media_url.match(/\.(mp3|wav|ogg)$/i)) embed = `<audio controls src="${post.media_url}"></audio>`;
                    else if (post.media_url.match(/\.(mp4|webm)$/i)) embed = `<video controls src="${post.media_url}"></video>`;
                    else embed = `<div style="padding:10px; text-align:center;"><a href="${post.media_url}" target="_blank" style="color:var(--accent)">🔗 Открыть ссылку</a></div>`;

                    mediaHtml += `
                        <div class="media-player-box">
                            <button class="play-trigger" onclick="toggleMedia('${pid}', this)">▶ Играть / Показать</button>
                            <div id="${pid}" class="player-frame">${embed}</div>
                        </div>
                    `;
                }

                const controls = isOwner ? `
                    <div style="margin-left:auto; display:flex; gap:8px;">
                        <button onclick="editPost('${post.id}', \`${post.content.replace(/`/g, '\\`')}\`)" style="background:none; border:none; cursor:pointer;">✏️</button>
                        <button onclick="deletePost('${post.id}')" style="background:none; border:none; cursor:pointer;">🗑️</button>
                    </div>
                ` : '';

                return `
                <div class="feed-item">
                    <div class="feed-header">
                        <div class="avatar">👤</div>
                        <span class="username">${post.author}</span>
                        <span class="timestamp">${new Date(post.created_at).toLocaleString()}</span>
                        ${controls}
                    </div>
                    <div class="post-content">${post.content}</div>
                    ${mediaHtml}
                </div>`;
            }).join('');
        }

        // ===== ФУНКЦИИ УПРАВЛЕНИЯ =====
        window.toggleMedia = function(id, btn) {
            const el = document.getElementById(id);
            if (el.style.display === 'block') {
                el.style.display = 'none';
                btn.textContent = '▶ Играть / Показать';
                // Стоп медиа
                const media = el.querySelector('audio, video, iframe');
                if(media) {
                    if(media.pause) media.pause();
                    if(media.tagName === 'IFRAME') { const s = media.src; media.src = ''; media.src = s; }
                }
            } else {
                el.style.display = 'block';
                btn.textContent = '⏸ Скрыть';
            }
        };

        window.deletePost = async function(id) {
            if (!confirm('Удалить пост?')) return;
            await supabaseClient.from('posts').delete().eq('id', id);
            loadPosts();
        };

        window.editPost = async function(id, text) {
            const newText = prompt('Редактировать:', text);
            if (newText !== null && newText !== text) {
                await supabaseClient.from('posts').update({ content: newText }).eq('id', id);
                loadPosts();
            }
        };

        checkAuth();
    </script>
</body>
</html>
