<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="manifest" href="./manifest.json">
    <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
    <link rel="icon" type="image/png" sizes="192x192" href="android-chrome-192x192.png">
    <meta name="theme-color" content="#7c3aed">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Smart Social">
    <title>Профиль | Smart Social</title>
    
    <script src="config.js"></script>
    <script src="i18n.js"></script>
    <script src="angel-widget.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <style>
        :root {
            --bg-primary: linear-gradient(135deg, #f5f0ff 0%, #e9d9ff 100%);
            --bg-secondary: #ffffff;
            --text-primary: #1e1e2f;
            --text-secondary: #6b6b80;
            --accent: #7c3aed;
            --border: #e9d9ff;
            --shadow: rgba(124, 58, 237, 0.1);
            --like-color: #ef4444;
        }
        [data-theme="dark"] {
            --bg-primary: linear-gradient(135deg, #1a0b2e 0%, #2d1b4e 100%);
            --bg-secondary: #2a1a3e;
            --text-primary: #f5f0ff;
            --text-secondary: #c4b5fd;
            --accent: #a78bfa;
            --border: #4c1d95;
            --shadow: rgba(167, 139, 250, 0.2);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; transition: all 0.3s ease; }
        body { font-family: system-ui, sans-serif; background: var(--bg-primary); min-height: 100vh; color: var(--text-primary); padding-bottom: 80px; }

        header { background: var(--bg-secondary); padding: 12px 20px; border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 100; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 2px 10px var(--shadow); }
        .logo { font-weight: 700; font-size: 20px; color: var(--accent); cursor: pointer; }
        .controls { display: flex; gap: 10px; align-items: center; }
        select { padding: 6px; border-radius: 8px; border: 1px solid var(--border); background: var(--bg-secondary); color: var(--text-primary); }
        .btn-sm { background: transparent; border: 1px solid var(--border); color: var(--text-secondary); padding: 6px 12px; border-radius: 16px; cursor: pointer; font-size: 13px; text-decoration: none; display: inline-block; }
        .btn-sm:hover { background: var(--border); color: var(--text-primary); }
        
        .profile-btn { width: 36px; height: 36px; border-radius: 50%; border: 2px solid var(--accent); background: var(--border); cursor: pointer; overflow: hidden; padding: 0; display: flex; align-items: center; justify-content: center; font-size: 18px; }
        .profile-btn img { width: 100%; height: 100%; object-fit: cover; }

        .nav-item { position: relative; display: inline-flex; align-items: center; }
        .badge { background: #ef4444; color: white; font-size: 10px; padding: 2px 6px; border-radius: 10px; margin-left: 4px; font-weight: bold; display: none; }
        .badge.show { display: inline-block; }
        .burger-btn { display: none; background: none; border: none; font-size: 28px; cursor: pointer; color: var(--text-primary); padding: 8px 12px; min-width: 44px; min-height: 44px; }

        @media (max-width: 900px) {
            .burger-btn { display: block; }
            .controls { display: none; position: absolute; top: 100%; left: 0; right: 0; background: var(--bg-secondary); flex-direction: column; padding: 15px; border-bottom: 1px solid var(--border); box-shadow: 0 4px 12px var(--shadow); z-index: 101; max-height: 80vh; overflow-y: auto; }
            .controls.active { display: flex; }
            .controls a, .controls button, .controls select, .controls .nav-item { width: 100%; margin: 5px 0; text-align: center; justify-content: center; }
        }

        .container { max-width: 600px; margin: 20px auto; padding: 0 16px; }
        
        .profile-card { background: var(--bg-secondary); border-radius: 24px; border: 1px solid var(--border); padding: 30px 20px; text-align: center; box-shadow: 0 4px 12px var(--shadow); margin-bottom: 24px; position: relative; }
        .avatar-wrapper { position: relative; width: 120px; height: 120px; margin: 0 auto 16px; }
        .avatar { width: 100%; height: 100%; border-radius: 50%; border: 4px solid var(--accent); background: var(--border); display: flex; align-items: center; justify-content: center; font-size: 48px; overflow: hidden; }
        .avatar img { width: 100%; height: 100%; object-fit: cover; }
        .avatar-upload { position: absolute; bottom: 0; right: 0; width: 36px; height: 36px; border-radius: 50%; background: var(--accent); color: white; display: flex; align-items: center; justify-content: center; cursor: pointer; border: 2px solid var(--bg-secondary); font-size: 18px; }
        
        .username { font-size: 24px; font-weight: 700; margin-bottom: 8px; }
        .meta { font-size: 14px; color: var(--text-secondary); margin-bottom: 16px; display: flex; justify-content: center; align-items: center; gap: 8px; }
        .bio { font-size: 16px; font-style: italic; margin-bottom: 20px; color: var(--text-primary); min-height: 24px; }
        
        .profile-actions { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin-bottom: 20px; }
        .btn-primary { background: var(--accent); color: white; border: none; padding: 10px 20px; border-radius: 20px; font-weight: 600; cursor: pointer; }
        .btn-primary:hover { opacity: 0.9; }

        .stats { display: flex; justify-content: space-around; margin-top: 20px; padding-top: 20px; border-top: 1px solid var(--border); }
        .stat-item { text-align: center; }
        .stat-value { font-size: 20px; font-weight: 700; color: var(--accent); }
        .stat-label { font-size: 12px; color: var(--text-secondary); }

        .section-title { font-size: 18px; font-weight: 600; margin: 24px 0 16px; display: flex; align-items: center; gap: 8px; }
        .posts-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
        .post-card { background: var(--bg-secondary); border: 1px solid var(--border); border-radius: 12px; padding: 12px; cursor: pointer; transition: transform 0.2s; }
        .post-card:hover { transform: translateY(-2px); border-color: var(--accent); }
        .post-text { font-size: 14px; line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
        .empty-state { text-align: center; padding: 40px 20px; color: var(--text-secondary); background: var(--bg-secondary); border-radius: 16px; border: 1px dashed var(--border); }

        .theme-toggle { position: fixed; bottom: 20px; left: 20px; width: 48px; height: 48px; border-radius: 50%; background: var(--bg-secondary); border: 1px solid var(--border); display: flex; align-items: center; justify-content: center; cursor: pointer; box-shadow: 0 4px 12px var(--shadow); font-size: 20px; z-index: 1000; }
    </style>
</head>
<body>

    <header>
        <div class="logo" onclick="location.href='feed.html'">Smart Social</div>
        <button class="burger-btn" id="burgerBtn">☰</button>
        <div class="controls" id="navControls">
            <select id="langSelect">
                <option value="ru">🇷 RU</option><option value="uk">🇦 UA</option>
                <option value="en">🇬🇧 EN</option><option value="es">🇪 ES</option><option value="de">🇪 DE</option>
            </select>
            <button class="profile-btn" onclick="location.href='profile.html'"><span id="headerAvatar">👤</span></button>
            <a href="feed.html" class="btn-sm" data-i18n="nav_feed"> Лента</a>
            <a href="search.html" class="btn-sm" data-i18n="nav_search">🔍 Поиск</a>
            <div class="nav-item">
                <a href="chat.html" class="btn-sm" data-i18n="nav_chat">💬 Чат</a>
                <span id="chatBadge" class="badge">0</span>
            </div>
            <a href="friends.html" class="btn-sm" data-i18n="nav_friends">👥 Друзья</a>
            <a href="about.html" class="btn-sm" data-i18n="nav_about">ℹ️ О сайте</a>
            <div class="nav-item">
                <a href="guests.html" class="btn-sm" data-i18n="nav_guests">👀 Гости</a>
                <span id="guestBadge" class="badge">0</span>
            </div>
            <button class="btn-sm" id="logoutBtn" data-i18n="nav_logout">Выйти</button>
        </div>
    </header>

    <div class="container">
        <div class="profile-card">
            <div class="avatar-wrapper">
                <div class="avatar" id="profileAvatar">👤</div>
                <label class="avatar-upload" id="avatarUploadBtn" style="display: none;">📷<input type="file" id="avatarInput" accept="image/*" style="display: none;"></label>
            </div>
            <h1 class="username" id="profileName">Загрузка...</h1>
            <div class="meta" id="profileMeta"></div>
            <div class="bio" id="profileBio">Пока без статуса. Но это можно исправить! ✨</div>
            
            <div class="profile-actions" id="profileActions">
                <!-- Кнопки действий генерируются JS -->
            </div>

            <div class="stats">
                <div class="stat-item"><div class="stat-value" id="statPosts">0</div><div class="stat-label">постов</div></div>
                <div class="stat-item"><div class="stat-value" id="statLikes">0</div><div class="stat-label">лайков собрано</div></div>
                <div class="stat-item"><div class="stat-value" id="statDays">0</div><div class="stat-label">дней с нами</div></div>
            </div>
        </div>

        <h2 class="section-title"> Мои публикации</h2>
        <div class="posts-grid" id="postsGrid">
            <div class="empty-state">Загрузка...</div>
        </div>
    </div>

    <button class="theme-toggle" id="themeToggle">🌙</button>

    <script>
        if (typeof SUPABASE_URL === 'undefined') { alert('Ошибка конфига'); window.location.href = 'index.html'; }
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        let currentUser = null;
        let targetUser = null;

        // === БУРГЕР-МЕНЮ ===
        const burgerBtn = document.getElementById('burgerBtn');
        const navControls = document.getElementById('navControls');
        if (burgerBtn && navControls) {
            burgerBtn.onclick = () => navControls.classList.toggle('active');
            navControls.querySelectorAll('a').forEach(link => link.onclick = () => navControls.classList.remove('active'));
        }

        // === СЧЕТЧИКИ (БЕЙДЖИ) ===
        async function updateBadges() {
            if (!currentUser) return;
            const { count: guestCount } = await supabaseClient.from('profile_visits').select('*', { count: 'exact', head: true }).eq('host_id', currentUser.id).eq('is_read', false);
            const gBadge = document.getElementById('guestBadge');
            if (gBadge) { gBadge.textContent = guestCount > 99 ? '99+' : guestCount; guestCount > 0 ? gBadge.classList.add('show') : gBadge.classList.remove('show'); }
            const { count: msgCount } = await supabaseClient.from('messages').select('*', { count: 'exact', head: true }).eq('receiver_id', currentUser.id).eq('is_read', false);
            const cBadge = document.getElementById('chatBadge');
            if (cBadge) { cBadge.textContent = msgCount > 99 ? '99+' : msgCount; msgCount > 0 ? cBadge.classList.add('show') : cBadge.classList.remove('show'); }
        }

        // === ТЕМА ===
        const themeToggle = document.getElementById('themeToggle');
        if (localStorage.getItem('theme') === 'dark') { document.documentElement.setAttribute('data-theme', 'dark'); themeToggle.textContent = '☀️'; }
        themeToggle.onclick = () => {
            const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
            document.documentElement.setAttribute('data-theme', isDark ? 'light' : 'dark');
            themeToggle.textContent = isDark ? '🌙' : '☀️';
            localStorage.setItem('theme', isDark ? 'light' : 'dark');
        };

        document.getElementById('logoutBtn').onclick = async () => { await supabaseClient.auth.signOut(); window.location.href = 'index.html'; };

        async function init() {
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (!session) return window.location.href = 'index.html';
            currentUser = session.user;

            const urlParams = new URLSearchParams(window.location.search);
            const targetUserId = urlParams.get('user_id') || currentUser.id;
            const isOwnProfile = targetUserId === currentUser.id;

            // Загружаем данные целевого пользователя
            const { data: u } = await supabaseClient.from('users').select('*').eq('id', targetUserId).single();
            if (!u) { alert('Пользователь не найден'); window.location.href = 'feed.html'; return; }
            targetUser = u;

            // Обновляем аватар в шапке
            const { data: me } = await supabaseClient.from('users').select('avatar_url').eq('id', currentUser.id).single();
            if (me && me.avatar_url) document.getElementById('headerAvatar').innerHTML = `<img src="${me.avatar_url}">`;

            // Заполняем профиль
            document.getElementById('profileName').textContent = u.username || 'Аноним';
            document.getElementById('profileAvatar').innerHTML = u.avatar_url ? `<img src="${u.avatar_url}">` : '👤';
            document.getElementById('profileBio').textContent = u.bio || 'Пока без статуса. Но это можно исправить! ✨';
            
            const genderSymbol = u.gender === 'female' ? '♀' : (u.gender === 'male' ? '♂' : '');
            const joinDate = new Date(u.created_at).toLocaleDateString('ru-RU', { day: 'numeric', month: 'long', year: 'numeric' });
            document.getElementById('profileMeta').innerHTML = `${genderSymbol ? genderSymbol + ' · ' : ''}На сайте с ${joinDate} г.`;

            // Кнопка смены аватара (только для своего профиля)
            document.getElementById('avatarUploadBtn').style.display = isOwnProfile ? 'flex' : 'none';

            // Кнопки действий
            const actionsDiv = document.getElementById('profileActions');
            actionsDiv.innerHTML = '';
            
            if (isOwnProfile) {
                actionsDiv.innerHTML += `<button class="btn-sm" onclick="editProfile()">✏️ Редактировать профиль</button>`;
                actionsDiv.innerHTML += `<button class="btn-sm" id="changePasswordBtn">🔑 Сменить пароль</button>`;
            } else {
                actionsDiv.innerHTML += `<button class="btn-sm" onclick="openChat('${u.id}')">💬 Написать</button>`;
                
                // Проверка статуса дружбы
                const { data: friendship } = await supabaseClient.from('friendships').select('status').or(`and(requester_id.eq.${currentUser.id},addressee_id.eq.${u.id}),and(requester_id.eq.${u.id},addressee_id.eq.${currentUser.id})`).single();
                
                if (!friendship) {
                    actionsDiv.innerHTML += `<button class="btn-sm" onclick="sendFriendRequest('${u.id}')">➕ Добавить в друзья</button>`;
                } else if (friendship.status === 'accepted') {
                    actionsDiv.innerHTML += `<button class="btn-sm" disabled style="opacity:0.6">👥 В друзьях</button>`;
                } else if (friendship.status === 'pending') {
                    if (friendship.requester_id === currentUser.id) {
                        actionsDiv.innerHTML += `<button class="btn-sm" disabled style="opacity:0.6">⏳ Заявка отправлена</button>`;
                    } else {
                        actionsDiv.innerHTML += `<button class="btn-sm" onclick="handleRequest('${friendship.id}', 'accepted')">✅ Принять заявку</button>`;
                    }
                }
            }

            // Статистика
            const { count: postCount } = await supabaseClient.from('posts').select('*', { count: 'exact', head: true }).eq('user_id', u.id);
            document.getElementById('statPosts').textContent = postCount || 0;

            const { data: userPosts } = await supabaseClient.from('posts').select('id').eq('user_id', u.id);
            let totalLikes = 0;
            if (userPosts && userPosts.length > 0) {
                const postIds = userPosts.map(p => p.id);
                const { count: likesCount } = await supabaseClient.from('likes').select('*', { count: 'exact', head: true }).in('post_id', postIds);
                totalLikes = likesCount || 0;
            }
            document.getElementById('statLikes').textContent = totalLikes;

            const daysSinceJoin = Math.floor((new Date() - new Date(u.created_at)) / (1000 * 60 * 60 * 24)) + 1;
            document.getElementById('statDays').textContent = daysSinceJoin > 0 ? daysSinceJoin : 1;

            // Загрузка постов
            loadUserPosts(u.id);

            // Запись визита (если не свой профиль)
            if (!isOwnProfile) {
                await supabaseClient.from('profile_visits').insert([{ host_id: targetUserId, visitor_id: currentUser.id }]);
            }

            updateBadges();

            // Обработчик смены пароля
            const changePassBtn = document.getElementById('changePasswordBtn');
            if (changePassBtn) {
                changePassBtn.onclick = async () => {
                    if (!isOwnProfile) { alert('Сменить пароль можно только в своем профиле!'); return; }
                    const oldPass = prompt('Введите текущий пароль:');
                    if (!oldPass) return;
                    const newPass = prompt('Введите новый пароль (минимум 6 символов):');
                    if (!newPass || newPass.length < 6) { alert('Пароль должен быть не короче 6 символов'); return; }
                    const confirmPass = prompt('Повторите новый пароль:');
                    if (newPass !== confirmPass) { alert('Пароли не совпадают!'); return; }
                    const { error: loginError } = await supabaseClient.auth.signInWithPassword({ email: currentUser.email, password: oldPass });
                    if (loginError) { alert('Неверный текущий пароль!'); return; }
                    const { error } = await supabaseClient.auth.updateUser({ password: newPass });
                    if (!error) alert('✅ Пароль успешно изменен!'); else alert('Ошибка: ' + error.message);
                };
            }
        }

        // === ЗАГРУЗКА АВАТАРА (SUPABASE STORAGE) ===
        document.getElementById('avatarInput').addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;
            if (file.size > 5 * 1024 * 1024) { alert('Файл слишком большой. Максимум 5MB.'); return; }
            try {
                const fileExt = file.name.split('.').pop();
                const fileName = `${currentUser.id}.${fileExt}`;
                const { data, error } = await supabaseClient.storage.from('avatars').upload(fileName, file, { upsert: true });
                if (error) throw error;
                const { data: { publicUrl } } = supabaseClient.storage.from('avatars').getPublicUrl(fileName);
                const avatarUrl = publicUrl + '?t=' + Date.now();
                const { error: dbError } = await supabaseClient.from('users').update({ avatar_url: avatarUrl }).eq('id', currentUser.id);
                if (dbError) throw dbError;
                await new Promise(resolve => setTimeout(resolve, 500));
                init();
            } catch (err) { alert('Ошибка загрузки аватара: ' + err.message); }
        });

        async function editProfile() {
            const newBio = prompt('Введите новый статус:', targetUser.bio || '');
            if (newBio !== null) {
                await supabaseClient.from('users').update({ bio: newBio }).eq('id', currentUser.id);
                init();
            }
        }

        async function sendFriendRequest(targetId) {
            const { error } = await supabaseClient.from('friendships').insert([{ requester_id: currentUser.id, addressee_id: targetId, status: 'pending' }]);
            if (!error) { alert('Заявка отправлена!'); init(); } else alert('Ошибка: ' + error.message);
        }

        async function handleRequest(reqId, status) {
            await supabaseClient.from('friendships').update({ status: status }).eq('id', reqId);
            init();
        }

        function openChat(partnerId) {
            localStorage.setItem('chatPartnerId', partnerId);
            window.location.href = 'chat.html';
        }

        async function loadUserPosts(userId) {
            const grid = document.getElementById('postsGrid');
            const { data: posts } = await supabaseClient.from('posts').select('*').eq('user_id', userId).order('created_at', { ascending: false });
            if (!posts || posts.length === 0) {
                grid.innerHTML = '<div class="empty-state" style="grid-column: 1/-1;">Публикаций пока нет 🌙</div>';
                return;
            }
            grid.innerHTML = posts.map(p => `
                <div class="post-card" onclick="alert('Полный просмотр поста: ${p.id}')">
                    <div class="post-text">${p.content}</div>
                </div>
            `).join('');
        }

        init();
    </script>
    <script src="footer.js"></script>
</body>
</html>
