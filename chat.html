<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="manifest" href="./manifest.json">
    <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
    <link rel="icon" type="image/png" sizes="192x192" href="android-chrome-192x192.png">
    <meta name="theme-color" content="#7c3aed">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Smart Social">
    <title>Сообщения | Smart Social</title>
    
    <script src="config.js"></script>
    <script src="i18n.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <style>
        :root {
            --bg-primary: linear-gradient(135deg, #f5f0ff 0%, #e9d9ff 100%);
            --bg-secondary: #ffffff;
            --text-primary: #1e1e2f;
            --text-secondary: #6b6b80;
            --accent: #7c3aed;
            --border: #e9d9ff;
            --shadow: rgba(124, 58, 237, 0.1);
            --msg-me: #7c3aed;
            --msg-them: #f3f4f6;
        }
        [data-theme="dark"] {
            --bg-primary: linear-gradient(135deg, #1a0b2e 0%, #2d1b4e 100%);
            --bg-secondary: #2a1a3e;
            --text-primary: #f5f0ff;
            --text-secondary: #c4b5fd;
            --accent: #a78bfa;
            --border: #4c1d95;
            --shadow: rgba(167, 139, 250, 0.2);
            --msg-them: #3b2a5e;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; transition: all 0.3s ease; }
        body { font-family: system-ui, sans-serif; background: var(--bg-primary); min-height: 100vh; color: var(--text-primary); display: flex; flex-direction: column; }

        header { background: var(--bg-secondary); padding: 12px 20px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; box-shadow: 0 2px 10px var(--shadow); position: sticky; top: 0; z-index: 100; }
        .logo { font-weight: 700; font-size: 20px; color: var(--accent); cursor: pointer; }
        .controls { display: flex; gap: 10px; align-items: center; }
        select { padding: 6px; border-radius: 8px; border: 1px solid var(--border); background: var(--bg-secondary); color: var(--text-primary); }
        .btn-sm { background: transparent; border: 1px solid var(--border); color: var(--text-secondary); padding: 6px 12px; border-radius: 16px; cursor: pointer; font-size: 13px; text-decoration: none; display: inline-block; }
        .btn-sm:hover { background: var(--border); color: var(--text-primary); }
        .profile-btn { width: 36px; height: 36px; border-radius: 50%; border: 2px solid var(--accent); background: var(--border); cursor: pointer; overflow: hidden; padding: 0; display: flex; align-items: center; justify-content: center; font-size: 18px; }
        .profile-btn img { width: 100%; height: 100%; object-fit: cover; }

        .nav-item { position: relative; display: inline-flex; align-items: center; }
        .badge { background: #ef4444; color: white; font-size: 10px; padding: 2px 6px; border-radius: 10px; margin-left: 4px; font-weight: bold; display: none; }
        .badge.show { display: inline-block; }
        .burger-btn { display: none; background: none; border: none; font-size: 24px; cursor: pointer; color: var(--text-primary); padding: 0 10px; }

        @media (max-width: 768px) {
            .burger-btn { display: block; }
            .controls { display: none; position: absolute; top: 100%; left: 0; right: 0; background: var(--bg-secondary); flex-direction: column; padding: 15px; border-bottom: 1px solid var(--border); box-shadow: 0 4px 12px var(--shadow); z-index: 99; }
            .controls.active { display: flex; }
            .controls a, .controls button, .controls select, .controls .nav-item { width: 100%; margin: 5px 0; text-align: center; justify-content: center; }
            
            .chat-container { flex-direction: column; height: auto; }
            .conversations-list { width: 100%; max-height: 200px; }
            .chat-window { min-height: 400px; }
        }

        .chat-container { display: flex; flex: 1; max-width: 1000px; width: 100%; margin: 20px auto; gap: 16px; padding: 0 16px; height: calc(100vh - 100px); }
        .conversations-list { width: 300px; background: var(--bg-secondary); border-radius: 16px; border: 1px solid var(--border); overflow-y: auto; box-shadow: 0 4px 12px var(--shadow); }
        .conv-item { padding: 14px; border-bottom: 1px solid var(--border); cursor: pointer; display: flex; align-items: center; gap: 10px; }
        .conv-item:hover, .conv-item.active { background: var(--border); }
        .conv-avatar { width: 40px; height: 40px; border-radius: 50%; background: var(--bg-primary); display: flex; align-items: center; justify-content: center; overflow: hidden; font-size: 20px; }
        .conv-avatar img { width: 100%; height: 100%; object-fit: cover; }
        .conv-info { flex: 1; }
        .conv-name { font-weight: 600; font-size: 14px; }
        .conv-preview { font-size: 12px; color: var(--text-secondary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 180px; }

        .chat-window { flex: 1; background: var(--bg-secondary); border-radius: 16px; border: 1px solid var(--border); display: flex; flex-direction: column; box-shadow: 0 4px 12px var(--shadow); }
        .chat-header { padding: 14px; border-bottom: 1px solid var(--border); font-weight: 600; display: flex; align-items: center; gap: 10px; }
        .messages-area { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
        
        .message { max-width: 80%; padding: 10px 14px; border-radius: 16px; font-size: 14px; line-height: 1.4; position: relative; display: flex; flex-direction: column; }
        .message.me { align-self: flex-end; background: var(--msg-me); color: white; border-bottom-right-radius: 4px; }
        .message.them { align-self: flex-start; background: var(--msg-them); color: var(--text-primary); border-bottom-left-radius: 4px; }
        .msg-sender { font-size: 11px; font-weight: 700; margin-bottom: 4px; opacity: 0.8; }
        .msg-text { white-space: pre-wrap; word-break: break-word; }
        .msg-actions { display: flex; justify-content: flex-end; align-items: center; gap: 8px; margin-top: 6px; }
        .msg-time { font-size: 10px; opacity: 0.7; }
        .msg-edit-btn, .msg-del-btn { background: none; border: none; cursor: pointer; font-size: 12px; opacity: 0.7; padding: 0; }
        .msg-edit-btn:hover, .msg-del-btn:hover { opacity: 1; }

        .chat-input-area { padding: 14px; border-top: 1px solid var(--border); display: flex; gap: 10px; align-items: flex-end; }
        .chat-input { flex: 1; padding: 12px; border: 1px solid var(--border); border-radius: 20px; background: var(--bg-primary); color: var(--text-primary); outline: none; resize: none; max-height: 100px; font-family: inherit; font-size: 14px; }
        .send-btn { background: var(--accent); color: white; border: none; width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0; }
        .send-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .send-btn svg { width: 20px; height: 20px; fill: white; margin-left: 2px; }
        .empty-state { flex: 1; display: flex; align-items: center; justify-content: center; color: var(--text-secondary); font-size: 14px; }

        .angel-widget { position: fixed; bottom: 20px; right: 20px; z-index: 999; }
        .angel-bubble { width: 56px; height: 56px; border-radius: 50%; background: var(--accent); display: flex; align-items: center; justify-content: center; cursor: pointer; box-shadow: 0 4px 12px var(--shadow); font-size: 28px; color: white; }
        .angel-window { position: absolute; bottom: 70px; right: 0; width: 300px; background: var(--bg-secondary); border: 1px solid var(--border); border-radius: 16px; padding: 16px; box-shadow: 0 8px 32px var(--shadow); display: none; }
        .theme-toggle { position: fixed; bottom: 20px; left: 20px; width: 48px; height: 48px; border-radius: 50%; background: var(--bg-secondary); border: 1px solid var(--border); display: flex; align-items: center; justify-content: center; cursor: pointer; box-shadow: 0 4px 12px var(--shadow); font-size: 20px; z-index: 1000; }
    </style>
</head>
<body>
    <header>
        <div class="logo" onclick="location.href='feed.html'">Smart Social</div>
        <button class="burger-btn" id="burgerBtn">☰</button>
        <div class="controls" id="navControls">
            <select id="langSelect">
                <option value="ru">🇷🇺 RU</option><option value="uk">🇺🇦 UA</option>
                <option value="en">🇧 EN</option><option value="es">🇪🇸 ES</option><option value="de">🇩🇪 DE</option>
            </select>
            <button class="profile-btn" onclick="location.href='profile.html'"><span id="headerAvatar">👤</span></button>
            <a href="feed.html" class="btn-sm" data-i18n="nav_feed">📰 Лента</a>
            <a href="search.html" class="btn-sm" data-i18n="nav_search">🔍 Поиск</a>
            <div class="nav-item">
                <a href="chat.html" class="btn-sm" data-i18n="nav_chat">💬 Чат</a>
                <span id="chatBadge" class="badge">0</span>
            </div>
            <a href="friends.html" class="btn-sm" data-i18n="nav_friends">👥 Друзья</a>
            <a href="about.html" class="btn-sm" data-i18n="nav_about">ℹ️ О сайте</a>
            <div class="nav-item">
                <a href="guests.html" class="btn-sm" data-i18n="nav_guests">👀 Гости</a>
                <span id="guestBadge" class="badge">0</span>
            </div>
            <button class="btn-sm" id="logoutBtn" data-i18n="nav_logout">Выйти</button>
        </div>
    </header>

    <div class="chat-container">
        <div class="conversations-list" id="convList">
            <div style="padding:20px; text-align:center; color:var(--text-secondary)">Загрузка...</div>
        </div>
        <div class="chat-window" id="chatWindow">
            <div class="empty-state" data-i18n="chat_empty">Выберите диалог слева, чтобы начать общение 💬</div>
        </div>
    </div>

    <div class="angel-widget">
        <div class="angel-window" id="angelWindow">
            <div style="display:flex; justify-content:space-between; margin-bottom:10px;">
                <strong>Ангел-Хранитель</strong>
                <span style="cursor:pointer;" onclick="document.getElementById('angelWindow').style.display='none'">✕</span>
            </div>
            <p style="font-size:14px; color:var(--text-secondary)">Общайся вежливо и с душой. Твои слова могут сделать чей-то день лучше! 👼</p>
        </div>
        <div class="angel-bubble" onclick="document.getElementById('angelWindow').style.display='block'">👼</div>
    </div>
    <button class="theme-toggle" id="themeToggle">🌙</button>

    <script>
        if (typeof SUPABASE_URL === 'undefined') { alert('Ошибка конфига'); window.location.href = 'index.html'; }
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        let currentUser = null;
        let activePartnerId = null;
        let activePartnerName = '';
        let partnersData = {}; 

        const burgerBtn = document.getElementById('burgerBtn');
        const navControls = document.getElementById('navControls');
        if (burgerBtn && navControls) {
            burgerBtn.onclick = () => navControls.classList.toggle('active');
            navControls.querySelectorAll('a').forEach(link => link.onclick = () => navControls.classList.remove('active'));
        }

        async function updateBadges() {
            if (!currentUser) return;
            const { count: guestCount } = await supabaseClient.from('profile_visits').select('*', { count: 'exact', head: true }).eq('host_id', currentUser.id).eq('is_read', false);
            const gBadge = document.getElementById('guestBadge');
            if (gBadge) { gBadge.textContent = guestCount > 99 ? '99+' : guestCount; guestCount > 0 ? gBadge.classList.add('show') : gBadge.classList.remove('show'); }
            const { count: msgCount } = await supabaseClient.from('messages').select('*', { count: 'exact', head: true }).eq('receiver_id', currentUser.id).eq('is_read', false);
            const cBadge = document.getElementById('chatBadge');
            if (cBadge) { cBadge.textContent = msgCount > 99 ? '99+' : msgCount; msgCount > 0 ? cBadge.classList.add('show') : cBadge.classList.remove('show'); }
        }

        const themeToggle = document.getElementById('themeToggle');
        if (localStorage.getItem('theme') === 'dark') { document.documentElement.setAttribute('data-theme', 'dark'); themeToggle.textContent = '☀️'; }
        themeToggle.onclick = () => {
            const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
            document.documentElement.setAttribute('data-theme', isDark ? 'light' : 'dark');
            themeToggle.textContent = isDark ? '🌙' : '☀️';
            localStorage.setItem('theme', isDark ? 'light' : 'dark');
        };

        document.getElementById('logoutBtn').onclick = async () => { await supabaseClient.auth.signOut(); window.location.href = 'index.html'; };

        async function init() {
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (!session) return window.location.href = 'index.html';
            currentUser = session.user;

            // СБРОС СЧЕТЧИКА СООБЩЕНИЙ: Помечаем все входящие как прочитанные
            await supabaseClient.from('messages').update({ is_read: true }).eq('receiver_id', currentUser.id).eq('is_read', false);

            const chatPartnerId = localStorage.getItem('chatPartnerId');
            if (chatPartnerId) {
                localStorage.removeItem('chatPartnerId');
                const { data: partner } = await supabaseClient.from('users').select('id, username, avatar_url').eq('id', chatPartnerId).single();
                if (partner) {
                    partnersData[partner.id] = partner; 
                    await loadConversations();
                    openChat(partner.id);
                } else { loadConversations(); }
            } else { loadConversations(); }
            
            updateBadges();
        }

        async function loadConversations() {
            const { data: msgs } = await supabaseClient.from('messages').select('sender_id, receiver_id, content, created_at').or(`sender_id.eq.${currentUser.id},receiver_id.eq.${currentUser.id}`).order('created_at', { ascending: false });
            if (!msgs || msgs.length === 0) { document.getElementById('convList').innerHTML = '<div style="padding:20px; text-align:center; color:var(--text-secondary)" data-i18n="chat_no_messages">Пока нет сообщений</div>'; return; }
            const partners = new Set();
            msgs.forEach(m => { const partnerId = m.sender_id === currentUser.id ? m.receiver_id : m.sender_id; partners.add(partnerId); });
            const { data: users } = await supabaseClient.from('users').select('id, username, avatar_url').in('id', Array.from(partners));
            users.forEach(u => partnersData[u.id] = u);
            const list = document.getElementById('convList');
            list.innerHTML = users.map(u => {
                const lastMsg = msgs.find(m => (m.sender_id === u.id && m.receiver_id === currentUser.id) || (m.sender_id === currentUser.id && m.receiver_id === u.id));
                const preview = lastMsg.sender_id === currentUser.id ? `Вы: ${lastMsg.content}` : `${u.username}: ${lastMsg.content}`;
                const avatarHtml = u.avatar_url ? `<img src="${u.avatar_url}">` : '👤';
                return `<div class="conv-item" onclick="openChat('${u.id}')">
                    <div class="conv-avatar">${avatarHtml}</div>
                    <div class="conv-info"><div class="conv-name">${u.username || 'Аноним'}</div><div class="conv-preview">${preview}</div></div>
                </div>`;
            }).join('');
        }

        async function openChat(partnerId) {
            activePartnerId = partnerId;
            const partner = partnersData[partnerId];
            activePartnerName = partner.username || 'Аноним';
            const avatarHtml = partner.avatar_url ? `<img src="${partner.avatar_url}" style="width:30px;height:30px;border-radius:50%;object-fit:cover;">` : '👤';
            document.getElementById('chatWindow').innerHTML = `
                <div class="chat-header">${avatarHtml}<span>${activePartnerName}</span></div>
                <div class="messages-area" id="messagesArea">Загрузка...</div>
                <div class="chat-input-area">
                    <textarea id="msgInput" class="chat-input" placeholder="${t('chat_placeholder') || 'Написать сообщение...'}" rows="1"></textarea>
                    <button class="send-btn" id="sendBtn" onclick="sendMessage()"><svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg></button>
                </div>`;
            await supabaseClient.from('messages').update({ is_read: true }).eq('sender_id', partnerId).eq('receiver_id', currentUser.id).eq('is_read', false);
            loadMessages();
        }

        async function loadMessages() {
            if (!activePartnerId) return;
            const area = document.getElementById('messagesArea');
            const { data: msgs } = await supabaseClient.from('messages').select('*').or(`and(sender_id.eq.${currentUser.id},receiver_id.eq.${activePartnerId}),and(sender_id.eq.${activePartnerId},receiver_id.eq.${currentUser.id})`).order('created_at', { ascending: true });
            if (!msgs || msgs.length === 0) { area.innerHTML = '<div style="text-align:center; color:var(--text-secondary); margin-top:20px;" data-i18n="chat_start_first">Начните общение первым! 👋</div>'; return; }
            area.innerHTML = msgs.map(m => {
                const isMe = m.sender_id === currentUser.id;
                const time = new Date(m.created_at).toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
                const senderName = isMe ? 'Вы' : activePartnerName;
                const safeContent = m.content.replace(/`/g, '\\`').replace(/\n/g, '\\n');
                return `<div class="message ${isMe ? 'me' : 'them'}">
                    <div class="msg-sender">${senderName}:</div>
                    <div class="msg-text">${m.content}</div>
                    <div class="msg-actions">
                        ${isMe ? `<button class="msg-edit-btn" onclick="editMessage('${m.id}', \`${safeContent}\`)">✏️</button><button class="msg-del-btn" onclick="deleteMessage('${m.id}')">🗑️</button>` : ''}
                        <span class="msg-time">${time} ${isMe && m.is_read ? '✓✓' : ''}</span>
                    </div>
                </div>`;
            }).join('');
            area.scrollTop = area.scrollHeight;
        }

        async function sendMessage() {
            const input = document.getElementById('msgInput');
            const content = input.value.trim();
            if (!content || !activePartnerId) return;
            const btn = document.getElementById('sendBtn'); btn.disabled = true;
            const { error } = await supabaseClient.from('messages').insert([{ sender_id: currentUser.id, receiver_id: activePartnerId, content: content, is_read: false }]);
            if (!error) { input.value = ''; input.style.height = 'auto'; loadMessages(); loadConversations(); }
            btn.disabled = false;
        }

        async function editMessage(msgId, oldContent) {
            const newContent = prompt(t('chat_edit_prompt') || 'Редактировать сообщение:', oldContent.replace(/\\n/g, '\n'));
            if (newContent !== null && newContent.trim() !== '' && newContent !== oldContent.replace(/\\n/g, '\n')) {
                await supabaseClient.from('messages').update({ content: newContent.trim() }).eq('id', msgId);
                loadMessages(); loadConversations();
            }
        }

        async function deleteMessage(msgId) {
            if (confirm(t('chat_delete_confirm') || 'Удалить сообщение?')) {
                await supabaseClient.from('messages').delete().eq('id', msgId);
                loadMessages(); loadConversations();
            }
        }

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey && document.activeElement.id === 'msgInput') { e.preventDefault(); sendMessage(); }
        });
        document.addEventListener('input', (e) => {
            if (e.target.id === 'msgInput') { e.target.style.height = 'auto'; e.target.style.height = (e.target.scrollHeight) + 'px'; }
        });

        init();
    </script>
</body>
</html>
