<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>👼 Админка SmartSocial</title>
    <link rel="stylesheet" href="css/admin.css">
    <!-- Подключаем Supabase SDK через CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

    <!-- ЭКРАН ВХОДА -->
    <div id="loginScreen" class="login">
        <div class="login-box">
            <h2>👼 Вход в Админку</h2>
            <p style="font-size:12px;color:#888;margin-bottom:15px;">Только для администраторов</p>
            <input type="email" id="loginEmail" placeholder="Email (например, admin@smartsocial.app)">
            <input type="password" id="loginPassword" placeholder="Пароль">
            <button onclick="doLogin()">Войти</button>
            <div class="error" id="loginError"></div>
        </div>
    </div>

    <!-- ОСНОВНОЙ ИНТЕРФЕЙС -->
    <div id="adminApp" class="admin">
        <div class="header">
            <h2>👼 SmartSocial Admin</h2>
            <button onclick="doLogout()" class="logout-btn">Выйти</button>
        </div>
        
        <!-- Навигация (Вкладки) -->
        <div class="tabs">
            <button class="tab active" onclick="switchTab('tickets', this)">🎫 Тикеты</button>
            <button class="tab" onclick="switchTab('kb', this)">📚 База Знаний</button>
        </div>

        <!-- РАЗДЕЛ: ТИКЕТЫ -->
        <div id="section-tickets" class="section active">
            <div class="stats">
                <div class="stat"><div class="label">Новые</div><div class="value" id="statNew">0</div></div>
                <div class="stat"><div class="label">Отвечено</div><div class="value" id="statAnswered">0</div></div>
                <div class="stat"><div class="label">Закрыто</div><div class="value" id="statClosed">0</div></div>
                <div class="stat"><div class="label">Всего</div><div class="value" id="statTotal">0</div></div>
            </div>

            <div class="controls">
                <input type="text" class="search" id="searchInput" placeholder="🔍 Поиск по вопросам..." oninput="renderTickets()">
                <button class="filter active" onclick="setFilter('all',this)">Все</button>
                <button class="filter" onclick="setFilter('new',this)">Новые</button>
                <button class="filter" onclick="setFilter('answered',this)">Отвеченные</button>
                <button class="filter" onclick="setFilter('closed',this)">Закрытые</button>
            </div>

            <table>
                <thead>
                    <tr>
                        <th>ID</th><th>Дата</th><th>Вопрос</th><th>Email</th><th>Статус</th><th>Действия</th>
                    </tr>
                </thead>
                <tbody id="ticketsBody">
                    <tr><td colspan="6" style="text-align:center;padding:15px;color:#888">Загрузка...</td></tr>
                </tbody>
            </table>
        </div>

        <!-- РАЗДЕЛ: БАЗА ЗНАНИЙ -->
        <div id="section-kb" class="section">
            <h3>📚 Управление базой знаний</h3>
            <p style="color:#888;font-size:12px;margin-bottom:15px;">Здесь можно редактировать и удалять готовые ответы.</p>
            <!-- Таблица БЗ будет рендериться через JS -->
            <div id="kbList">Загрузка...</div>
        </div>
    </div>

    <!-- МОДАЛКА ОТВЕТА (Скрыта по умолчанию) -->
    <div class="modal" id="replyModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Ответ на тикет</h3>
                <button class="close" onclick="closeModal()">×</button>
            </div>
            <div class="q-block">
                <strong style="color:#667eea;display:block;margin-bottom:5px;font-size:10px">Вопрос пользователя:</strong>
                <span id="modalQuestion"></span>
            </div>
            <div class="form-group">
                <label>Ваш ответ:</label>
                <textarea id="modalAnswer" placeholder="Введите ответ..."></textarea>
            </div>
            <div class="checkbox">
                <input type="checkbox" id="addToKB" checked>
                <label for="addToKB">Сохранить этот ответ в Базу Знаний</label>
            </div>
            <div class="modal-actions">
                <button class="modal-btn modal-btn-secondary" onclick="closeModal()">Отмена</button>
                <button class="modal-btn modal-btn-primary" onclick="sendReply()">Отправить ответ</button>
            </div>
        </div>
    </div>

    <!-- Уведомления -->
    <div class="toast" id="toast"></div>

    <!-- Подключение наших скриптов (порядок важен!) -->
    <script src="js/config.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/api.js"></script>
    <script src="js/tickets.js"></script>
    <script src="js/kb.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
