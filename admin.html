<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"></head>
<body style="background:#1a1a2e; color:#fff; padding:20px; font-family:sans-serif;">
    <h2>Тест Supabase</h2>
    <button onclick="testLogin()" style="padding:15px; font-size:16px;">Проверить вход</button>
    <div id="res" style="margin-top:20px; color:#4caf50;"></div>

    <script>
        // ВСТАВЬ СВОИ ДАННЫЕ НИЖЕ:
        const URL = 'https://wgewycchecbsulyvqfzj.supabase.co';
        const KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndnZXd5Y2NoZWNic3VseXZxZnpqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU4NTg1NTYsImV4cCI6MjEwMTQzNDU1Nn0.y80cZy7KiLWKJ1Grh2lkjUdtCGsBos6uC6cNJmRiCTs';

        async function testLogin() {
            alert('Начинаем проверку!');
            const resDiv = document.getElementById('res');
            resDiv.innerText = 'Загрузка...';
            
            try {
                const res = await fetch(URL + '/auth/v1/token?grant_type=password', {
                    method: 'POST',
                    headers: {
                        'apikey': KEY,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        email: 'admin@smartsocial.local',
                        password: 'admin123'
                    })
                });
                const data = await res.json();
                
                if (data.access_token) {
                    resDiv.innerText = '✅ УСПЕХ! Токен получен: ' + data.access_token.substring(0, 20) + '...';
                    resDiv.style.color = '#4caf50';
                } else {
                    resDiv.innerText = '❌ ОШИБКА: ' + JSON.stringify(data);
                    resDiv.style.color = '#ff6b6b';
                }
            } catch (e) {
                resDiv.innerText = '❌ ОШИБКА СЕТИ: ' + e.message;
                resDiv.style.color = '#ff6b6b';
            }
        }
    </script>
